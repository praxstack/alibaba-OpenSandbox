f7ed" stroke="#ea580c" stroke-width="1.5" rx="8"/><use width="20" height="20" x="506" y="712" color="#ea580c" href="#ic-shield" xlink:href="#ic-shield"/><text x="534" y="726" fill="#9a3412" class="t-name">egress</text><text x="534" y="744" class="t-body">per-sandbox network policy (dns+nft)</text><text x="534" y="760" class="t-small">driven by fastlet over loopback</text></g><g><rect width="670" height="106" x="140" y="798" fill="#fefce8" stroke="#ca8a04" stroke-width="1.8" filter="url(#sh)" rx="10"/><use width="40" height="40" x="158" y="822" color="#a16207" href="#ic-vm" xlink:href="#ic-vm"/><text x="212" y="838" fill="#713f12" class="t-name">firecracker microVM</text><text x="212" y="858" class="t-body">execd :44772 baked into the golden image</text><text x="212" y="876" class="t-small">snapshot restore · isolated kernel per sandbox</text><line x1="475" x2="475" y1="784" y2="798" stroke="#16a34a" stroke-width="2.2" marker-end="url(#mG)"/></g></g><g><rect width="410" height="462" x="850" y="530" fill="url(#gNode)" stroke="#3b82f6" stroke-width="2" filter="url(#sh)" rx="14"/><use width="22" height="22" x="870" y="546" color="#1d4ed8" href="#ic-chip" xlink:href="#ic-chip"/><text x="902" y="562" class="t-name">kind node B</text><g><rect width="360" height="76" x="870" y="580" fill="#faf5ff" stroke="#9333ea" stroke-width="1.8" filter="url(#sh)" rx="10"/><use width="26" height="26" x="888" y="596" color="#9333ea" href="#ic-hex" xlink:href="#ic-hex"/><text x="926" y="606" fill="#6b21a8" class="t-name">runtime-agent + DART</text><text x="926" y="626" class="t-body">first pull served by the peer</text><text x="926" y="642" class="t-small">cache → peer → origin</text></g><g><rect width="360" height="112" x="870" y="672" fill="#ecfeff" stroke="#0891b2" stroke-width="1.8" filter="url(#sh)" rx="10"/><text x="886" y="692" fill="#155e75" class="t-name">fastlet Pod</text><rect width="150" height="68" x="886" y="700" fill="#cffafe" stroke="#06b6d4" stroke-width="1.5" rx="8"/><tex