e" xlink:href="#ic-route"/><text x="790" y="256" class="t-name">ingress gateway</text><text x="790" y="276" class="t-body">verifies f1.* scopes · resolves sandbox endpoints</text><text x="790" y="292" class="t-body">proxies client traffic into sandboxes</text></g><rect width="1140" height="128" x="120" y="376" fill="#eff6ff" stroke="#3b82f6" stroke-dasharray="7 5" stroke-width="1.6" rx="12"/><text x="140" y="398" fill="#1d4ed8" class="t-zone">NS FAST-SANDBOX-SYSTEM</text><g><rect width="470" height="84" x="160" y="408" fill="#fff" stroke="#3b82f6" stroke-width="1.8" filter="url(#sh)" rx="12"/><use width="28" height="28" x="178" y="424" color="#1d4ed8" href="#ic-chip" xlink:href="#ic-chip"/><text x="220" y="436" class="t-name">controller + FastPath</text><text x="220" y="456" class="t-body">owns Sandbox / SandboxPool / SandboxTemplate CRs</text><text x="220" y="472" class="t-body">placement &amp; capacity · spawns template builders</text></g><g><rect width="240" height="84" x="700" y="408" fill="#fffbeb" stroke="#b45309" stroke-width="1.8" filter="url(#sh)" rx="12"/><use width="26" height="26" x="716" y="424" color="#b45309" href="#ic-doc" xlink:href="#ic-doc"/><text x="752" y="436" fill="#92400e" class="t-name">SandboxTemplate CR</text><text x="752" y="456" class="t-body">build spec + exact index key</text><text x="752" y="472" class="t-body">status: phase · manifestRef</text></g><g><rect width="280" height="84" x="980" y="408" fill="#fff" stroke="#3b82f6" stroke-width="1.8" filter="url(#sh)" rx="12"/><use width="26" height="26" x="996" y="424" color="#1d4ed8" href="#ic-doc" xlink:href="#ic-doc"/><text x="1032" y="436" class="t-name">Sandbox CR</text><text x="1032" y="456" class="t-body">spec: image · policy bindings</text><text x="1032" y="472" class="t-body">status: runtime · data plane</text><text x="996" y="486" class="t-small">written via FastPath · watched by the server</text></g><path fill="none" stroke="#1d4ed8" stroke-dasharray="5 4" stroke-width="2" marker