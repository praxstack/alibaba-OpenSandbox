<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="500" font-family="-apple-system,'Helvetica Neue',Arial,sans-serif" viewBox="0 0 1160 500"><defs><marker id="mB" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="4"><path fill="#2563eb" d="M0,0 L8,4 L0,8 Z"/></marker><filter id="sh" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="2" flood-color="#0f172a" flood-opacity=".12" stdDeviation="3"/></filter></defs><rect width="1160" height="500" fill="#fff"/><text x="40" y="36" fill="#0f172a" font-size="20" font-weight="700">Layered execution security</text><text x="40" y="58" fill="#64748b" font-size="12">Layers compose: the sandbox boundary always applies, the floor applies to every user process, isolated sessions add a namespace per execution.</text><rect width="800" height="326" x="60" y="100" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)" rx="14"/><text x="84" y="132" fill="#0f172a" font-size="14" font-weight="700">Layer 1 — Sandbox boundary</text><text x="84" y="154" fill="#94a3b8" font-size="11">runtime isolation set by the platform at create time</text><rect width="720" height="250" x="100" y="176" fill="#fff" stroke="#94a3b8" stroke-width="1.4" filter="url(#sh)" rx="12"/><text x="124" y="206" fill="#0f172a" font-size="14" font-weight="700">Layer 2 — Hardening floor (every user process)</text><text x="124" y="228" fill="#94a3b8" font-size="11">capabilities dropped · no_new_privs · seccomp denylist · Landlock allowlist</text><rect width="640" height="140" x="140" y="252" fill="#fff" stroke="#94a3b8" stroke-width="1.4" filter="url(#sh)" rx="12"/><text x="164" y="282" fill="#0f172a" font-size="14" font-weight="700">Layer 3 — Isolated session (optional, per execution)</text><text x="164" y="304" fill="#94a3b8" font-size="11">private namespace · read-only binds · writable allowlist</text><rect width="560" height="52" x="180" y="322" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)" rx="10"/><text x="200" y="354" fill="#0f172a" font-size="13" font-weight="700">Your process</text><rect width="210" height="150" x="910" y="176" fill="#fff" stroke="#cbd5e1" stroke-dasharray="5 4" stroke-width="1.3" filter="url(#sh)" rx="12"/><text x="928" y="206" fill="#0f172a" font-size="13" font-weight="700">eBPF observer</text><text x="928" y="230" fill="#475569" font-size="11">optional, off by default</text><text x="928" y="254" fill="#475569" font-size="11">exec · connect · privilege</text><text x="928" y="272" fill="#475569" font-size="11">events, sandbox-scoped</text><text x="928" y="290" fill="#94a3b8" font-size="11">JSONL audit log</text><path fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#mB)" d="M860,250 L904,250"/><text x="860" y="238" fill="#2563eb" font-size="10.5">events</text><rect width="1060" height="30" x="60" y="440" fill="#f8fafc" stroke="#e2e8f0" rx="8"/><text x="80" y="460" fill="#475569" font-size="11.5">Every layer reports its state — active, degraded, or unsupported — so clients can verify what is actually enforced.</text></svg>