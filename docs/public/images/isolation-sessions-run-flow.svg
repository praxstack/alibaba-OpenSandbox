<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" aria-labelledby="title desc" role="img" viewBox="0 0 1100 560"><title id="title">Isolation Session Run Flow</title><desc id="desc">A POST /run request: execd acquires the per-session runMu, writes the user code to bash stdin, streams stdout back as SSE, then detects the end marker and emits complete.</desc><defs><marker id="a-green" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#047857" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="a-purple" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#6d28d9" d="M 0 0 L 10 5 L 0 10 z"/></marker><style>text{font-family:Menlo,Monaco,Consolas,&quot;Liberation Mono&quot;,monospace}.actor-title,.title{font-weight:700}.title{font-size:22px;fill:#1e40af}.actor-title{font-size:15px;fill:#1e3a5f}.actor-sub{font-size:12px;font-weight:600;fill:#64748b}.step-label,.step-num{font-size:14px;font-weight:700}.step-num{fill:#fff}.step-label{fill:#1e3a5f}.mono{font-size:12px;font-weight:600;fill:#374151}.line{fill:none;stroke-linecap:round;stroke-linejoin:round}</style></defs><rect width="1100" height="560" fill="#fff"/><text x="30" y="40" class="title">POST /session/{id}/run — request flow</text><rect width="200" height="55" x="50" y="70" fill="#ddd6fe" stroke="#6d28d9" stroke-width="2" rx="8" ry="8"/><text x="150" y="95" class="actor-title" text-anchor="middle">Client</text><text x="150" y="113" class="actor-sub" text-anchor="middle">SDK / curl</text><rect width="200" height="55" x="330" y="70" fill="#a7f3d0" stroke="#047857" stroke-width="2" rx="8" ry="8"/><text x="430" y="95" class="actor-title" text-anchor="middle">execd</text><text x="430" y="113" class="actor-sub" text-anchor="middle">per-session runMu</text><rect width="240" height="55" x="610" y="70" fill="#fff" stroke="#1e3a5f" stroke-width="2" rx="8" ry="8"/><text x="730" y="95" class="actor-title" text-anchor="middle">bwrap → bash</text><text x="730" y="113" class="actor-sub" text-anchor="middle">long-lived shell (PID 1 in ns)</text><line x1="150" x2="150" y1="125" y2="530" stroke="#6d28d9" stroke-dasharray="4 6" stroke-width="1.5"/><line x1="430" x2="430" y1="125" y2="530" stroke="#047857" stroke-dasharray="4 6" stroke-width="1.5"/><line x1="730" x2="730" y1="125" y2="530" stroke="#1e3a5f" stroke-dasharray="4 6" stroke-width="1.5"/><circle cx="70" cy="170" r="13" fill="#6d28d9"/><text x="70" y="175" class="step-num" text-anchor="middle">1</text><text x="92" y="167" class="step-label">POST .../run { code, envs, timeout }</text><path stroke="#6d28d9" stroke-width="2.5" marker-end="url(#a-purple)" d="M 150 195 H 420" class="line"/><circle cx="345" cy="230" r="13" fill="#047857"/><text x="345" y="235" class="step-num" text-anchor="middle">2</text><text x="368" y="227" class="step-label">acquire per-session runMu</text><text x="368" y="245" class="mono">(concurrent runs queue here)</text><circle cx="345" cy="290" r="13" fill="#047857"/><text x="345" y="295" class="step-num" text-anchor="middle">3</text><text x="368" y="287" class="step-label">write to bash stdin pipe</text><text x="368" y="305" class="mono">export KEY=VAL # from envs</text><text x="368" y="323" class="mono">&lt;user code&gt;</text><text x="368" y="341" class="mono">echo &lt;END_MARKER&gt; $?</text><path stroke="#047857" stroke-width="2.5" marker-end="url(#a-green)" d="M 450 350 H 720" class="line"/><rect width="230" height="50" x="618" y="370" fill="#eff6ff" stroke="#1e3a5f" stroke-width="1.5" rx="6" ry="6"/><text x="630" y="392" class="step-label">bash executes in namespaces</text><text x="630" y="410" class="mono">writes → overlay upper dir</text><circle cx="345" cy="450" r="13" fill="#047857"/><text x="345" y="455" class="step-num" text-anchor="middle">4</text><text x="368" y="447" class="step-label">stream stdout as SSE</text><path stroke="#047857" stroke-width="2.5" marker-end="url(#a-green)" d="M 720 430 H 450" class="line"/><path stroke="#6d28d9" stroke-width="2.5" marker-end="url(#a-purple)" d="M 410 470 H 170" class="line"/><circle cx="345" cy="510" r="13" fill="#047857"/><text x="345" y="515" class="step-num" text-anchor="middle">5</text><text x="368" y="507" class="step-label">detect END_MARKER → SSE complete</text><text x="368" y="525" class="mono">release runMu, reset idle timer</text><path stroke="#6d28d9" stroke-width="2.5" marker-end="url(#a-purple)" d="M 410 525 H 170" class="line"/></svg>