<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="440" font-family="-apple-system,'Helvetica Neue',Arial,sans-serif" viewBox="0 0 1180 440"><defs><marker id="mB" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="4"><path fill="#2563eb" d="M0,0 L8,4 L0,8 Z"/></marker><marker id="mG" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="4"><path fill="#64748b" d="M0,0 L8,4 L0,8 Z"/></marker><filter id="sh" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="2" flood-color="#0f172a" flood-opacity=".12" stdDeviation="3"/></filter></defs><rect width="1180" height="440" fill="#fff"/><text x="40" y="36" fill="#0f172a" font-size="20" font-weight="700">Putting ingress behind TLS</text><text x="40" y="58" fill="#64748b" font-size="12">The ingress speaks cleartext HTTP/1.1 only. The front proxy must deliver WebSocket upgrades as classic HTTP/1.1 — RFC 8441 (h2) is not accepted.</text><rect width="240" height="110" x="60" y="120" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)" rx="12"/><text x="80" y="150" fill="#0f172a" font-size="14" font-weight="700">Browser / client</text><text x="80" y="176" fill="#475569" font-size="11">TLS + ALPN (h2, http/1.1)</text><text x="80" y="198" fill="#94a3b8" font-size="11">drop h2 → simplest, verified</text><rect width="320" height="110" x="420" y="120" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)" rx="12"/><text x="440" y="150" fill="#0f172a" font-size="14" font-weight="700">TLS front proxy (L7)</text><text x="440" y="176" fill="#475569" font-size="11">terminates TLS · hands the ingress</text><text x="440" y="194" fill="#475569" font-size="11">HTTP/1.1, including WS upgrades</text><text x="440" y="216" fill="#94a3b8" font-size="11">never forwards h2 to the ingress</text><rect width="280" height="110" x="860" y="120" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)" rx="12"/><text x="880" y="150" fill="#0f172a" font-size="14" font-weight="700">Ingress</text><text x="880" y="176" fill="#475569" font-size="11">cleartext HTTP/1.1 · no TLS</text><text x="880" y="198" fill="#94a3b8" font-size="11">subprotocols, cookies, close codes</text><rect width="720" height="70" x="420" y="290" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)" rx="12"/><text x="440" y="320" fill="#0f172a" font-size="13" font-weight="700">Sandbox workload</text><text x="440" y="344" fill="#94a3b8" font-size="11">sees ordinary HTTP/1.1 requests and WebSocket connections, with X-Forwarded-* preserved</text><path fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#mB)" d="M300,175 L414,175"/><text x="304" y="162" fill="#2563eb" font-size="10.5">TLS</text><path fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#mB)" d="M740,175 L854,175"/><text x="746" y="162" fill="#2563eb" font-size="10.5">http/1.1</text><path fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#mG)" d="M1000,230 L1000,284"/><rect width="1080" height="30" x="60" y="390" fill="#f8fafc" stroke="#e2e8f0" rx="8"/><text x="80" y="410" fill="#475569" font-size="11.5">Strategies, in order: 1 · drop h2 from browser-facing ALPN (verified) · 2 · per-WebSocket HTTP/1.1 fallback · 3 · RFC 8441 translation (verify first)</text></svg>