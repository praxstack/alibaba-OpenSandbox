<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" aria-labelledby="title desc" role="img" viewBox="0 0 1600 1000"><title id="title">A fresh identity per allocation</title><desc id="desc">Sandboxes pre-warmed in pools stay gated with every business endpoint answering 503. At assignment the platform delivers a per-allocation binding and calls the internal init endpoint; execd applies the binding atomically, reports ready, and only then opens the API to client traffic carrying the new token. Nothing from the previous allocation survives the swap.</desc><defs><marker id="data" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="8" refY="4"><path fill="#2563eb" d="M0 0L9 4L0 8Z"/></marker><style>text{font-family:&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif;fill:#182636}.label{font-size:17px;fill:#597080}.body{font-size:18px;fill:#4d6173}.heading{font-size:22px;font-weight:600}.edge{font-size:16px;font-weight:500}</style></defs><rect width="1600" height="1000" fill="#fff"/><text x="48" y="62" font-size="38" font-weight="700">A fresh identity per allocation</text><text x="48" y="96" class="body">Warm sandboxes serve no one until the platform delivers the binding — then the swap is atomic.</text><path fill="none" stroke="#2563eb" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#data)" d="M1150 54h36"/><text x="1196" y="60" class="edge" style="fill:#2563eb">Delivery / traffic</text><path fill="none" stroke="#597080" stroke-dasharray="5 5" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" d="M1400 54h36"/><text x="1446" y="60" class="edge" style="fill:#597080">Gated state</text><rect width="300" height="88" x="200" y="128" fill="#f7faff" stroke="#d6e1e9" stroke-width="1.5" rx="10"/><text x="220" y="164" class="heading">Platform</text><text x="220" y="192" class="label">control plane · pool manager</text><rect width="360" height="88" x="650" y="128" fill="#f7faff" stroke="#d6e1e9" stroke-width="1.5" rx="10"/><text x="670" y="164" class="heading">execd — warm sandbox</text><text x="670" y="192" class="label">port 44772 · gated at boot</text><rect width="280" height="88" x="1180" y="128" fill="#f7faff" stroke="#d6e1e9" stroke-width="1.5" rx="10"/><text x="1200" y="164" class="heading">Client</text><text x="1200" y="192" class="label">SDK · agent</text><path fill="none" stroke="#c9d4de" stroke-dasharray="5 5" stroke-width="1.5" d="M350 216V880"/><path fill="none" stroke="#c9d4de" stroke-dasharray="5 5" stroke-width="1.5" d="M830 216V880"/><path fill="none" stroke="#c9d4de" stroke-dasharray="5 5" stroke-width="1.5" d="M1320 216V880"/><rect width="380" height="104" x="640" y="252" fill="#fafbfd" stroke="#d8e1e8" stroke-dasharray="6 5" stroke-width="1.5" rx="10"/><text x="660" y="288" class="heading">Warm in pool — gated</text><text x="660" y="318" class="body">every business endpoint answers 503</text><text x="660" y="344" class="label">/ping · /ready stay open</text><path fill="none" stroke="#2563eb" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#data)" d="M354 420H824"/><text x="370" y="404" class="edge" style="fill:#2563eb">1 · allocation assigned</text><text x="370" y="450" class="label">sandbox id · env · token hash · lifecycle hooks</text><path fill="none" stroke="#2563eb" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#data)" d="M354 505H824"/><text x="370" y="489" class="edge" style="fill:#2563eb">2 · POST /internal/init</text><rect width="380" height="104" x="640" y="535" fill="#f1f6ff" stroke="#a9c7f3" stroke-width="1.5" rx="10"/><text x="660" y="571" class="heading">3 · applied atomically</text><text x="660" y="601" class="body">binding swapped · lifecycle hooks run</text><path fill="none" stroke="#2563eb" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#data)" d="M826 700H354"/><text x="370" y="684" class="edge" style="fill:#2563eb">4 · GET /ready → 200 — API opens</text><text x="370" y="730" class="label">business endpoints leave 503</text><path fill="none" stroke="#2563eb" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#data)" d="M1316 800H834"/><text x="850" y="784" class="edge" style="fill:#2563eb">5 · real traffic — new token required</text><text x="850" y="830" class="label">the previous token is already invalid</text><rect width="1504" height="68" x="48" y="912" fill="#f7f9fc" stroke="#d6e1e9" stroke-width="1.5" rx="10"/><text x="72" y="945" class="heading">Nothing from the previous allocation survives</text><text x="660" y="945" class="body">environment · access token · telemetry attribution — replaced atomically</text></svg>