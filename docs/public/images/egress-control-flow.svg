<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="480" font-family="-apple-system,'Helvetica Neue',Arial,sans-serif" viewBox="0 0 1180 480"><defs><marker id="mB" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="4"><path fill="#2563eb" d="M0,0 L8,4 L0,8 Z"/></marker><marker id="mG" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="4"><path fill="#64748b" d="M0,0 L8,4 L0,8 Z"/></marker><filter id="sh" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="2" flood-color="#0f172a" flood-opacity=".12" stdDeviation="3"/></filter></defs><rect width="1180" height="480" fill="#fff"/><text x="40" y="36" fill="#0f172a" font-size="20" font-weight="700">Egress — outbound control at two layers</text><text x="40" y="58" fill="#64748b" font-size="12">The sidecar shares the sandbox&apos;s network namespace, so every outbound packet passes it — no application configuration, no way around it from inside.</text><rect width="640" height="320" x="50" y="100" fill="#fff" stroke="#94a3b8" stroke-dasharray="7 5" stroke-width="1.4" filter="url(#sh)" rx="14"/><text x="70" y="128" fill="#334155" font-size="13" font-weight="700">Shared network namespace</text><rect width="220" height="90" x="80" y="150" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)" rx="10"/><text x="96" y="178" fill="#0f172a" font-size="13" font-weight="700">Sandbox workload</text><text x="96" y="200" fill="#94a3b8" font-size="11">unprivileged · no NET_ADMIN</text><rect width="220" height="90" x="80" y="290" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)" rx="10"/><text x="96" y="318" fill="#0f172a" font-size="13" font-weight="700">Egress sidecar</text><text x="96" y="340" fill="#94a3b8" font-size="11">holds the only NET_ADMIN</text><text x="96" y="358" fill="#94a3b8" font-size="11">exits rather than run unenforced</text><rect width="260" height="90" x="400" y="150" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)" rx="10"/><text x="416" y="178" fill="#0f172a" font-size="13" font-weight="700">Layer 1 — DNS filter</text><text x="416" y="200" fill="#475569" font-size="11">denied → NXDOMAIN · allowed → resolve,</text><text x="416" y="218" fill="#94a3b8" font-size="11">resolved IPs feed the network layer</text><rect width="260" height="90" x="400" y="290" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)" rx="10"/><text x="416" y="318" fill="#0f172a" font-size="13" font-weight="700">Layer 2 — nftables verdict</text><text x="416" y="340" fill="#475569" font-size="11">default-deny; static rules + bounded</text><text x="416" y="358" fill="#94a3b8" font-size="11">leases on DNS-learned addresses</text><path fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#mB)" d="M300,180 L394,182"/><text x="308" y="168" fill="#2563eb" font-size="10.5">DNS :53</text><path fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#mB)" d="M300,330 L394,332"/><text x="306" y="318" fill="#2563eb" font-size="10.5">TCP 80/443</text><path fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#mG)" d="M530,240 L530,284"/><text x="538" y="268" fill="#64748b" font-size="10.5">resolved IPs</text><ellipse cx="530" cy="430" fill="#f8fafc" stroke="#94a3b8" rx="90" ry="14"/><text x="530" y="434" fill="#475569" font-size="10.5" text-anchor="middle">external network</text><path fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#mB)" d="M530,380 L530,412"/><text x="538" y="402" fill="#64748b" font-size="10.5">allowed</text><rect width="400" height="150" x="740" y="110" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)" rx="12"/><text x="760" y="140" fill="#0f172a" font-size="14" font-weight="700">Who writes the policy?</text><text x="760" y="166" fill="#475569" font-size="11.5">1 · platform overlays — deny.always / allow.always,</text><text x="760" y="184" fill="#475569" font-size="11.5">hot-reloaded, users cannot override</text><text x="760" y="210" fill="#475569" font-size="11.5">2 · your policy — per sandbox, by FQDN / wildcard /</text><text x="760" y="228" fill="#475569" font-size="11.5">IP / CIDR, mutable at runtime</text><text x="760" y="250" fill="#94a3b8" font-size="11">first match wins; the platform&apos;s deny always beats your allow</text><rect width="400" height="130" x="740" y="290" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)" rx="12"/><text x="760" y="320" fill="#0f172a" font-size="14" font-weight="700">Credentials stay outside</text><text x="760" y="346" fill="#475569" font-size="11.5">with transparent TLS interception, matching outbound</text><text x="760" y="364" fill="#475569" font-size="11.5">requests are authenticated by the sidecar —</text><text x="760" y="382" fill="#475569" font-size="11.5">the sandbox never holds the secret</text><text x="760" y="404" fill="#94a3b8" font-size="11">vault is in-memory · bindings are host-scoped</text></svg>