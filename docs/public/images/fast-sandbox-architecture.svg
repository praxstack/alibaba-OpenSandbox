<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="640" font-family="-apple-system,'Helvetica Neue',Arial,sans-serif" viewBox="0 0 1180 640"><defs><marker id="mB" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="4"><path fill="#2563eb" d="M0,0 L8,4 L0,8 Z"/></marker><marker id="mG" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="4"><path fill="#64748b" d="M0,0 L8,4 L0,8 Z"/></marker><filter id="sh" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="2" flood-color="#0f172a" flood-opacity=".12" stdDeviation="3"/></filter></defs><rect width="1180" height="640" fill="#fff"/><text x="40" y="36" fill="#0f172a" font-size="20" font-weight="700">Fast Sandbox — overall architecture</text><text x="40" y="58" fill="#64748b" font-size="12">OpenSandbox owns the adapters; fast-sandbox owns the platform. Kubernetes CRDs are the durable record between them.</text><rect width="320" height="200" x="50" y="90" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)" rx="14"/><text x="70" y="120" fill="#0f172a" font-size="14" font-weight="700">OpenSandbox</text><text x="70" y="146" fill="#475569" font-size="11.5">Lifecycle server — FastSandboxService</text><text x="70" y="166" fill="#475569" font-size="11.5">Ingress gateway — FastSandboxProvider</text><text x="70" y="186" fill="#475569" font-size="11.5">Egress image — fast-sandbox profile</text><text x="70" y="212" fill="#94a3b8" font-size="11">same public API, SDKs and CLI as every</text><text x="70" y="230" fill="#94a3b8" font-size="11">other backend; fsb- IDs route here</text><rect width="330" height="200" x="440" y="90" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)" rx="14"/><text x="460" y="120" fill="#0f172a" font-size="14" font-weight="700">fast-sandbox control plane</text><text x="460" y="146" fill="#475569" font-size="11.5">reconcilers + FastPath gRPC (v2)</text><text x="460" y="166" fill="#475569" font-size="11.5">template builder · janitor · placement</text><text x="460" y="192" fill="#94a3b8" font-size="11">mutations and live operations run here;</text><text x="460" y="210" fill="#94a3b8" font-size="11">state lives in the CRDs below, so the</text><text x="460" y="228" fill="#94a3b8" font-size="11">control plane is restartable by design</text><rect width="300" height="200" x="840" y="90" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)" rx="14"/><text x="860" y="120" fill="#0f172a" font-size="14" font-weight="700">Kubernetes CRDs (durable)</text><text x="860" y="146" fill="#475569" font-size="11.5">SandboxPool · Sandbox · SandboxTemplate</text><text x="860" y="166" fill="#475569" font-size="11.5">SandboxSnapshot</text><text x="860" y="192" fill="#94a3b8" font-size="11">every sandbox&apos;s intent, placement,</text><text x="860" y="210" fill="#94a3b8" font-size="11">policy bindings and observations —</text><text x="860" y="228" fill="#94a3b8" font-size="11">survives any component restart</text><rect width="720" height="250" x="50" y="330" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)" rx="14"/><text x="70" y="360" fill="#0f172a" font-size="14" font-weight="700">Nodes — Fastlet pods (one pool spans nodes)</text><text x="70" y="386" fill="#475569" font-size="11.5">each Fastlet: many sandboxes (containers or Firecracker microVMs), the shared</text><text x="70" y="404" fill="#475569" font-size="11.5">egress process (Sandbox Actions handler), and a node-local runtime agent + DART</text><rect width="200" height="60" x="70" y="424" fill="#fff" stroke="#cbd5e1" stroke-width="1.2" rx="10"/><text x="86" y="450" fill="#334155" font-size="11.5" font-weight="600">Sandbox A</text><text x="86" y="468" fill="#94a3b8" font-size="10.5">network slot · subject</text><rect width="200" height="60" x="290" y="424" fill="#fff" stroke="#cbd5e1" stroke-width="1.2" rx="10"/><text x="306" y="450" fill="#334155" font-size="11.5" font-weight="600">Sandbox B</text><text x="306" y="468" fill="#94a3b8" font-size="10.5">network slot · subject</text><rect width="240" height="60" x="510" y="424" fill="#fff" stroke="#cbd5e1" stroke-width="1.2" rx="10"/><text x="526" y="450" fill="#334155" font-size="11.5" font-weight="600">runtime agent + DART</text><text x="526" y="468" fill="#94a3b8" font-size="10.5">socket delegation · block delivery</text><rect width="300" height="250" x="840" y="330" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)" rx="14"/><text x="860" y="360" fill="#0f172a" font-size="14" font-weight="700">Artifact store</text><text x="860" y="386" fill="#475569" font-size="11.5">template golden images, published as</text><text x="860" y="404" fill="#475569" font-size="11.5">content-addressed artifacts (S3-compatible)</text><text x="860" y="434" fill="#475569" font-size="11.5">snapshots and pause checkpoints land here;</text><text x="860" y="452" fill="#475569" font-size="11.5">nodes pull blocks peer-to-peer, not from</text><text x="860" y="470" fill="#475569" font-size="11.5">the origin</text><path fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#mB)" d="M370,180 L434,180"/><text x="372" y="168" fill="#2563eb" font-size="10.5">gRPC control</text><path fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#mG)" d="M770,180 L834,180"/><text x="772" y="168" fill="#64748b" font-size="10.5">CRs</text><path fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#mB)" d="M600,296 L600,324"/><text x="608" y="314" fill="#2563eb" font-size="10.5">reconcile · actions · endpoints</text><path fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#mG)" d="M790,455 L834,430"/><text x="780" y="416" fill="#64748b" font-size="10.5">peer pulls</text></svg>