<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="950" aria-labelledby="title desc" role="img" viewBox="0 0 1500 950"><title id="title">Pool capacity model</title><desc id="desc">A BatchSandbox claims a warm buffer pod in constant time. Allocated pods are recorded in the alloc-status annotation; starting pods count toward the pool total but are never advertised. When a sandbox is deleted the pod returns and the recycle strategy decides: delete and replace, restart containers, or return as-is. Scaling is paced by maxUnavailable and eviction removes idle labeled pods.</desc><defs><marker id="control" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="8" refY="4"><path fill="#dc6b2e" d="M0 0L9 4L0 8Z"/></marker><marker id="data" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="8" refY="4"><path fill="#2563eb" d="M0 0L9 4L0 8Z"/></marker><marker id="outbound" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="8" refY="4"><path fill="#059669" d="M0 0L9 4L0 8Z"/></marker><style>text{font-family:&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif;fill:#182636}.section{font-size:14px;font-weight:700;letter-spacing:1.4px;fill:#597080}.label{font-size:17px;fill:#597080}.body{font-size:18px;fill:#4d6173}.heading{font-size:22px;font-weight:600}.edge{font-size:16px;font-weight:500}</style></defs><rect width="1500" height="950" fill="#fff"/><text x="48" y="62" font-size="38" font-weight="700">Pool capacity model</text><text x="48" y="96" class="body">Two-level capacity · paced scaling · recycle on return</text><path fill="none" stroke="#dc6b2e" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#control)" d="M900 54h36"/><text x="946" y="60" class="edge" style="fill:#dc6b2e">Allocation flow</text><path fill="none" stroke="#059669" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#outbound)" d="M1120 54h36"/><text x="1166" y="60" class="edge" style="fill:#059669">Release &amp; return</text><path fill="none" stroke="#2563eb" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#data)" d="M1350 54h36"/><text x="1396" y="60" class="edge" style="fill:#2563eb">Maturation</text><rect width="300" height="360" x="48" y="128" fill="#fafbfd" stroke="#d8e1e8" stroke-width="1.5" rx="12"/><text x="72" y="158" class="section">CONSUMERS</text><rect width="264" height="110" x="72" y="180" fill="#fff" stroke="#dae5ef" stroke-width="1.5" rx="8"/><text x="88" y="210" class="heading">BatchSandbox</text><text x="88" y="240" class="body">waiting replicas</text><text x="88" y="266" class="label">one claim per replica</text><rect width="264" height="100" x="72" y="330" fill="#fff" stroke="#c9dbf1" stroke-dasharray="6 5" stroke-width="1.5" rx="8"/><text x="88" y="360" class="heading">Sandbox deleted</text><text x="88" y="388" class="label">pod must return</text><rect width="1004" height="360" x="448" y="128" fill="#f5f9ff" stroke="#c9dbf1" stroke-width="1.5" rx="12"/><text x="472" y="158" class="section">POOL · TOTAL BOUNDED BY POOLMIN / POOLMAX</text><rect width="956" height="104" x="472" y="180" fill="#f1fbf5" stroke="#afdcc0" stroke-width="1.5" rx="10"/><text x="492" y="210" class="heading">Warm buffer</text><text x="492" y="240" class="body">Running &amp; Ready · unallocated — what allocations draw from</text><text x="492" y="268" class="label">kept within bufferMin / bufferMax</text><rect width="464" height="140" x="472" y="312" fill="#f1f6ff" stroke="#a9c7f3" stroke-width="1.5" rx="10"/><text x="492" y="342" class="heading">Allocated</text><text x="492" y="372" class="body">claimed by a BatchSandbox</text><text x="492" y="400" class="label">recorded in the alloc-status annotation</text><rect width="464" height="140" x="964" y="312" fill="#fafbfd" stroke="#d8e1e8" stroke-width="1.5" rx="10"/><text x="984" y="342" class="heading">Starting</text><text x="984" y="372" class="body">still becoming ready</text><text x="984" y="400" class="label">counts toward the total, never advertised</text><path fill="none" stroke="#dc6b2e" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#control)" d="M336 232H468"/><text x="350" y="216" class="edge" style="fill:#dc6b2e">claim</text><path fill="none" stroke="#dc6b2e" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#control)" d="M620 284V312"/><path fill="none" stroke="#2563eb" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#data)" d="M1196 312V284"/><path fill="none" stroke="#059669" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#outbound)" d="M1452 634H1482V232H1436"/><text x="1150" y="514" class="edge" style="fill:#059669">recycled pods replenish the buffer</text><rect width="1004" height="190" x="448" y="528" fill="#fff9f3" stroke="#efd7c4" stroke-width="1.5" rx="12"/><text x="472" y="560" class="section">RECYCLE STRATEGY · WHEN A POD RETURNS</text><rect width="300" height="110" x="472" y="584" fill="#fff" stroke="#e7d5c8" stroke-width="1.5" rx="8"/><text x="488" y="614" class="heading">Delete</text><text x="488" y="644" class="body">replace with a fresh pod</text><text x="488" y="672" class="label">default</text><rect width="300" height="110" x="806" y="584" fill="#fff" stroke="#e7d5c8" stroke-width="1.5" rx="8"/><text x="822" y="614" class="heading">Restart</text><text x="822" y="644" class="body">restart containers in place</text><rect width="300" height="110" x="1140" y="584" fill="#fff" stroke="#e7d5c8" stroke-width="1.5" rx="8"/><text x="1156" y="614" class="heading">Noop</text><text x="1156" y="644" class="body">return as-is</text><text x="1156" y="672" class="label">state may leak</text><path fill="none" stroke="#059669" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#outbound)" d="M218 430V634H468"/><text x="232" y="540" class="edge" style="fill:#059669">release</text><rect width="1404" height="64" x="48" y="766" fill="#f7f9fc" stroke="#d6e1e9" stroke-width="1.5" rx="10"/><text x="72" y="794" class="heading">Scale pacing</text><text x="240" y="794" class="body">each step ≤ maxUnavailable (default 25%), minus pods still starting — a measured ramp, not a thundering herd</text><rect width="1404" height="64" x="48" y="846" fill="#f7f9fc" stroke="#d6e1e9" stroke-width="1.5" rx="10"/><text x="72" y="874" class="heading">Eviction</text><text x="188" y="874" class="body">label an idle pool pod pool.opensandbox.io/evict — allocated pods are protected, replenishment restores the buffer</text></svg>