<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="520" font-family="-apple-system,'Helvetica Neue',Arial,sans-serif" viewBox="0 0 1180 520"><defs><marker id="mB" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="4"><path fill="#2563eb" d="M0,0 L8,4 L0,8 Z"/></marker><marker id="mG" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="4"><path fill="#64748b" d="M0,0 L8,4 L0,8 Z"/></marker><filter id="sh" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="2" flood-color="#0f172a" flood-opacity=".12" stdDeviation="3"/></filter></defs><rect width="1180" height="520" fill="#fff"/><text x="40" y="36" fill="#0f172a" font-size="20" font-weight="700">execd — the single entry point into a sandbox</text><text x="40" y="58" fill="#64748b" font-size="12">Every client talks to one daemon; every capability is one API away.</text><rect width="210" height="52" x="50" y="130" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)" rx="10"/><text x="66" y="162" fill="#0f172a" font-size="13" font-weight="700">SDKs</text><rect width="210" height="52" x="50" y="202" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)" rx="10"/><text x="66" y="234" fill="#0f172a" font-size="13" font-weight="700">osb CLI</text><rect width="210" height="52" x="50" y="274" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)" rx="10"/><text x="66" y="306" fill="#0f172a" font-size="13" font-weight="700">MCP server</text><rect width="210" height="52" x="50" y="346" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)" rx="10"/><text x="66" y="378" fill="#0f172a" font-size="13" font-weight="700">Lifecycle server</text><rect width="780" height="380" x="360" y="100" fill="#fff" stroke="#94a3b8" stroke-dasharray="7 5" stroke-width="1.4" filter="url(#sh)" rx="14"/><text x="380" y="128" fill="#334155" font-size="13" font-weight="700">Sandbox</text><rect width="260" height="120" x="390" y="150" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)" rx="10"/><text x="406" y="180" fill="#0f172a" font-size="15" font-weight="700">execd</text><text x="406" y="204" fill="#475569" font-size="11.5">in-sandbox daemon · port 44772</text><text x="406" y="224" fill="#94a3b8" font-size="11">shared access token enforced</text><rect width="260" height="100" x="390" y="330" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)" rx="10"/><text x="406" y="360" fill="#0f172a" font-size="13" font-weight="700">Your workload</text><text x="406" y="384" fill="#94a3b8" font-size="11">supervised by execd: signals,</text><text x="406" y="402" fill="#94a3b8" font-size="11">exit codes, child reaping</text><path fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#mG)" d="M520,326 L520,274"/><text x="528" y="304" fill="#64748b" font-size="10.5">supervision</text><rect width="340" height="56" x="760" y="140" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)" rx="10"/><text x="776" y="174" fill="#0f172a" font-size="13" font-weight="700">Command execution</text><rect width="340" height="56" x="760" y="212" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)" rx="10"/><text x="776" y="246" fill="#0f172a" font-size="13" font-weight="700">Code execution</text><rect width="340" height="56" x="760" y="284" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)" rx="10"/><text x="776" y="318" fill="#0f172a" font-size="13" font-weight="700">Interactive terminals</text><rect width="340" height="56" x="760" y="356" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)" rx="10"/><text x="776" y="390" fill="#0f172a" font-size="13" font-weight="700">Files and directories</text><rect width="340" height="40" x="760" y="428" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)" rx="10"/><text x="776" y="454" fill="#0f172a" font-size="13" font-weight="700">Metrics</text><path fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#mB)" d="M260,156 L384,196"/><path fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#mB)" d="M260,228 L384,218"/><path fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#mB)" d="M260,300 L384,246"/><path fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#mB)" d="M260,372 L384,240"/><text x="290" y="176" fill="#2563eb" font-size="11">execd API</text><path fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#mB)" d="M650,190 L754,168"/><path fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#mB)" d="M650,214 L754,240"/><path fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#mB)" d="M650,238 L754,312"/><path fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#mB)" d="M650,258 L754,384"/><path fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#mB)" d="M650,268 L754,448"/></svg>