<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="520" font-family="-apple-system,'Helvetica Neue',Arial,sans-serif" viewBox="0 0 1180 520"><defs><marker id="mB" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="4"><path fill="#2563eb" d="M0,0 L8,4 L0,8 Z"/></marker><marker id="mG" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="4"><path fill="#64748b" d="M0,0 L8,4 L0,8 Z"/></marker><filter id="sh" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="2" flood-color="#0f172a" flood-opacity=".12" stdDeviation="3"/></filter></defs><rect width="1180" height="520" fill="#fff"/><text x="40" y="36" fill="#0f172a" font-size="20" font-weight="700">Ingress routing — from request to sandbox port</text><text x="40" y="58" fill="#64748b" font-size="12">The ingress carries no per-sandbox config: it watches workload state and resolves every request against a live cache.</text><rect width="250" height="120" x="50" y="140" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)" rx="12"/><text x="66" y="170" fill="#0f172a" font-size="14" font-weight="700">Client request</text><text x="66" y="196" fill="#475569" font-size="11">header: OpenSandbox-Ingress-To:</text><text x="66" y="214" fill="#475569" font-size="11">my-sandbox-8080</text><text x="66" y="238" fill="#475569" font-size="11">uri: /my-sandbox/8080/api/users</text><rect width="360" height="200" x="420" y="110" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)" rx="12"/><text x="440" y="142" fill="#0f172a" font-size="14" font-weight="700">Ingress gateway</text><text x="440" y="172" fill="#475569" font-size="12">1 · resolve route → sandbox + port</text><text x="440" y="204" fill="#475569" font-size="12">2 · look up endpoint (live workload cache)</text><text x="440" y="236" fill="#475569" font-size="12">3 · forward: routing headers stripped,</text><text x="440" y="254" fill="#475569" font-size="12">X-Forwarded-* added, path preserved</text><text x="440" y="286" fill="#94a3b8" font-size="11">annotation · service FQDN · FastPath</text><rect width="230" height="100" x="900" y="170" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)" rx="12"/><text x="916" y="200" fill="#0f172a" font-size="14" font-weight="700">Sandbox port</text><text x="916" y="226" fill="#475569" font-size="11">HTTP and WebSocket,</text><text x="916" y="244" fill="#94a3b8" font-size="11">streamed both directions</text><path fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#mB)" d="M300,200 L414,200"/><path fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#mB)" d="M780,200 L894,200"/><text x="60" y="360" fill="#334155" font-size="13" font-weight="700">When routing cannot proceed:</text><rect width="150" height="56" x="60" y="376" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" rx="10"/><text x="135" y="400" fill="#0f172a" font-size="13" font-weight="700" text-anchor="middle">404</text><text x="135" y="420" fill="#94a3b8" font-size="10.5" text-anchor="middle">no such sandbox</text><rect width="150" height="56" x="230" y="376" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" rx="10"/><text x="305" y="400" fill="#0f172a" font-size="13" font-weight="700" text-anchor="middle">503</text><text x="305" y="420" fill="#94a3b8" font-size="10.5" text-anchor="middle">not ready yet</text><rect width="150" height="56" x="400" y="376" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" rx="10"/><text x="475" y="400" fill="#0f172a" font-size="13" font-weight="700" text-anchor="middle">502</text><text x="475" y="420" fill="#94a3b8" font-size="10.5" text-anchor="middle">infrastructure</text><text x="590" y="396" fill="#475569" font-size="11">Once reached, backend responses pass through verbatim —</text><text x="590" y="414" fill="#475569" font-size="11">redirects are never followed.</text><rect width="1080" height="30" x="60" y="462" fill="#f8fafc" stroke="#e2e8f0" rx="8"/><text x="80" y="482" fill="#475569" font-size="11.5">Routing state comes from what workloads already publish — no per-sandbox configuration exists anywhere in the gateway.</text></svg>