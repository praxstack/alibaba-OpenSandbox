<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" font-family="-apple-system,'Helvetica Neue',Arial,sans-serif" viewBox="0 0 1120 360"><defs><marker id="mB" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="4"><path fill="#2563eb" d="M0,0 L8,4 L0,8 Z"/></marker><marker id="mG" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="4"><path fill="#64748b" d="M0,0 L8,4 L0,8 Z"/></marker><filter id="sh" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="2" flood-color="#0f172a" flood-opacity=".12" stdDeviation="3"/></filter></defs><rect width="1120" height="360" fill="#fff"/><text x="40" y="36" fill="#0f172a" font-size="20" font-weight="700">PTY terminals — one writer, many viewers</text><text x="40" y="58" fill="#64748b" font-size="12">An interactive terminal per session over WebSocket. A second writer is rejected; read-only viewers can join, replay, and watch.</text><rect width="230" height="100" x="60" y="120" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)" rx="12"/><text x="80" y="150" fill="#0f172a" font-size="14" font-weight="700">Holder</text><text x="80" y="174" fill="#475569" font-size="11">read-write · exclusive</text><text x="80" y="192" fill="#94a3b8" font-size="11">takeover replaces it</text><rect width="280" height="140" x="430" y="100" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)" rx="12"/><text x="450" y="130" fill="#0f172a" font-size="14" font-weight="700">PTY session</text><text x="450" y="154" fill="#475569" font-size="11">bash, POSIX sh fallback</text><text x="450" y="176" fill="#475569" font-size="11">replay buffer: viewers catch up</text><text x="450" y="194" fill="#475569" font-size="11">from a point in the past (since=N)</text><text x="450" y="216" fill="#94a3b8" font-size="11">survives holder reconnects</text><rect width="230" height="100" x="850" y="110" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)" rx="12"/><text x="870" y="140" fill="#0f172a" font-size="14" font-weight="700">Viewer A</text><text x="870" y="164" fill="#475569" font-size="11">read-only · replay + live</text><text x="870" y="182" fill="#94a3b8" font-size="11">never acquires the holder</text><rect width="230" height="70" x="850" y="230" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)" rx="12"/><text x="870" y="258" fill="#0f172a" font-size="14" font-weight="700">Viewer B</text><text x="870" y="282" fill="#475569" font-size="11">can join mid-session</text><path fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#mB)" d="M290,158 L424,150"/><text x="300" y="142" fill="#2563eb" font-size="10.5">stdin · resize · signals</text><path fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#mB)" d="M424,190 L290,196"/><text x="296" y="214" fill="#2563eb" font-size="10.5">stdout / stderr</text><path fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#mG)" d="M710,160 L844,158"/><path fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#mG)" d="M710,220 L844,262"/><text x="720" y="146" fill="#64748b" font-size="10.5">replay + live</text><text x="60" y="330" fill="#64748b" font-size="11">Viewers can join only while the shell is running; when it exits, everyone receives the exit frame. The bounded replay buffer is</text><text x="60" y="348" fill="#64748b" font-size="11">retained, so a viewer rejoining with since=0 still sees the previous lifetime&apos;s output.</text></svg>