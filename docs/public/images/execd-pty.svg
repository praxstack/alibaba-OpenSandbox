<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" aria-labelledby="title desc" role="img" viewBox="0 0 1600 760"><title id="title">PTY terminals — one writer, many viewers</title><desc id="desc">Each execd terminal session is a real PTY over WebSocket. The holder owns the keyboard exclusively; any number of read-only viewers can join, replay past output from the buffer, and follow live. A second writer is rejected.</desc><defs><marker id="data" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="8" refY="4"><path fill="#2563eb" d="M0 0L9 4L0 8Z"/></marker><marker id="neutral" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="8" refY="4"><path fill="#597080" d="M0 0L9 4L0 8Z"/></marker><style>text{font-family:&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif;fill:#182636}.section{font-size:14px;font-weight:700;letter-spacing:1.4px;fill:#597080}.label{font-size:17px;fill:#597080}.body{font-size:18px;fill:#4d6173}.heading{font-size:22px;font-weight:600}.edge{font-size:16px;font-weight:500}</style></defs><rect width="1600" height="760" fill="#fff"/><text x="48" y="62" font-size="38" font-weight="700">PTY terminals — one writer, many viewers</text><text x="48" y="96" class="body">An interactive terminal per session over WebSocket. A second writer is rejected; read-only viewers can join, replay, and watch.</text><path fill="none" stroke="#2563eb" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#data)" d="M1150 54h36"/><text x="1196" y="60" class="edge" style="fill:#2563eb">Terminal I/O</text><path fill="none" stroke="#597080" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#neutral)" d="M1400 54h36"/><text x="1446" y="60" class="edge" style="fill:#597080">Replay + live</text><rect width="350" height="300" x="48" y="128" fill="#f7faff" stroke="#d6e1e9" stroke-width="1.5" rx="12"/><text x="72" y="162" class="section">WRITER</text><rect width="302" height="150" x="72" y="186" fill="#f1f6ff" stroke="#a9c7f3" stroke-width="1.5" rx="10"/><text x="92" y="222" class="heading">Holder</text><text x="92" y="254" class="body">read-write · exclusive</text><text x="92" y="282" class="label">takeover replaces it</text><rect width="520" height="420" x="588" y="128" fill="#f5f9ff" stroke="#c9dbf1" stroke-width="1.5" rx="12"/><text x="612" y="162" class="section">PTY SESSION</text><rect width="472" height="310" x="612" y="186" fill="#fff" stroke="#c9dbf1" stroke-width="1.5" rx="10"/><text x="632" y="222" class="heading">PTY session</text><text x="632" y="260" class="body">bash, POSIX sh fallback</text><text x="632" y="296" class="body">replay buffer: viewers catch up</text><text x="632" y="332" class="body">from a point in the past (since=N)</text><text x="632" y="372" class="label">survives holder reconnects</text><rect width="364" height="420" x="1188" y="128" fill="#fafbfd" stroke="#d8e1e8" stroke-width="1.5" rx="12"/><text x="1212" y="162" class="section">VIEWERS — READ-ONLY</text><rect width="316" height="150" x="1212" y="186" fill="#fff" stroke="#d8e1e8" stroke-width="1.5" rx="10"/><text x="1232" y="222" class="heading">Viewer A</text><text x="1232" y="254" class="body">replay + live follow</text><text x="1232" y="282" class="label">never acquires the holder</text><rect width="316" height="110" x="1212" y="366" fill="#fff" stroke="#d8e1e8" stroke-width="1.5" rx="10"/><text x="1232" y="402" class="heading">Viewer B</text><text x="1232" y="432" class="label">can join mid-session</text><path fill="none" stroke="#2563eb" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#data)" d="M374 240H604"/><text x="384" y="222" class="edge" style="fill:#2563eb">stdin · resize · signals</text><path fill="none" stroke="#2563eb" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#data)" d="M608 290L378 296"/><text x="384" y="326" class="edge" style="fill:#2563eb">stdout / stderr</text><path fill="none" stroke="#597080" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#neutral)" d="M1084 250H1204"/><path fill="none" stroke="#597080" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#neutral)" d="M1084 300L1204 408"/><text x="1094" y="232" class="edge" style="fill:#597080">replay + live</text><rect width="1504" height="88" x="48" y="640" fill="#f7f9fc" stroke="#d6e1e9" stroke-width="1.5" rx="10"/><text x="72" y="676" class="body">Viewers can join only while the shell is running; when it exits, everyone receives the exit frame.</text><text x="72" y="708" class="body">The bounded replay buffer is retained, so a viewer rejoining with since=0 still sees the previous lifetime&apos;s output.</text></svg>