<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="440" font-family="-apple-system,'Helvetica Neue',Arial,sans-serif" viewBox="0 0 1180 440"><defs><marker id="mB" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="4"><path fill="#2563eb" d="M0,0 L8,4 L0,8 Z"/></marker><marker id="mG" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="4"><path fill="#64748b" d="M0,0 L8,4 L0,8 Z"/></marker><filter id="sh" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="2" flood-color="#0f172a" flood-opacity=".12" stdDeviation="3"/></filter></defs><rect width="1180" height="440" fill="#fff"/><text x="40" y="36" fill="#0f172a" font-size="20" font-weight="700">Artifact storage and delivery</text><text x="40" y="58" fill="#64748b" font-size="12">Everything a sandbox runs or resumes from is a content-addressed artifact in one store; nodes exchange blocks peer-to-peer.</text><rect width="240" height="110" x="60" y="120" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)" rx="12"/><text x="80" y="150" fill="#0f172a" font-size="14" font-weight="700">Template builder</text><text x="80" y="174" fill="#475569" font-size="11">converts an OCI image into a</text><text x="80" y="192" fill="#94a3b8" font-size="11">golden-image artifact (+ kernel)</text><rect width="280" height="130" x="440" y="110" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)" rx="12"/><text x="460" y="140" fill="#0f172a" font-size="14" font-weight="700">Artifact store (S3-compatible)</text><text x="460" y="166" fill="#475569" font-size="11">golden images · snapshot checkpoints</text><text x="460" y="184" fill="#475569" font-size="11">content-addressed, digest-referenced;</text><text x="460" y="202" fill="#94a3b8" font-size="11">the single origin of sandbox state</text><rect width="270" height="150" x="860" y="100" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)" rx="12"/><text x="880" y="130" fill="#0f172a" font-size="14" font-weight="700">Node state-root</text><text x="880" y="156" fill="#475569" font-size="11">per-node private cache (XFS reflink)</text><text x="880" y="178" fill="#475569" font-size="11">fastlet-local artifacts for instant</text><text x="880" y="196" fill="#94a3b8" font-size="11">sandbox starts; never shared across nodes</text><rect width="270" height="90" x="860" y="290" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)" rx="12"/><text x="880" y="318" fill="#0f172a" font-size="13" font-weight="700">DART daemons (per node)</text><text x="880" y="342" fill="#475569" font-size="11">roster via headless Service; blocks</text><text x="880" y="360" fill="#94a3b8" font-size="11">flow cache → peer → origin</text><path fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#mB)" d="M300,165 L434,168"/><text x="308" y="152" fill="#2563eb" font-size="10.5">publish</text><path fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#mB)" d="M720,150 L854,150"/><text x="726" y="138" fill="#2563eb" font-size="10.5">first pull (4 MiB blocks)</text><path fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#mG)" d="M995,254 L995,284"/><text x="1003" y="274" fill="#64748b" font-size="10.5">serves peers</text><rect width="660" height="80" x="60" y="300" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)" rx="12"/><text x="80" y="330" fill="#0f172a" font-size="13" font-weight="700">Sandboxes on any node</text><text x="80" y="354" fill="#475569" font-size="11">started from node-local artifacts; pause/resume checkpoints round-trip through the same store, digest-pinned</text><path fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#mB)" d="M860,220 C700,280 500,320 470,332"/><text x="560" y="272" fill="#2563eb" font-size="10.5">instant starts</text><rect width="1080" height="30" x="60" y="396" fill="#f8fafc" stroke="#e2e8f0" rx="8"/><text x="80" y="416" fill="#475569" font-size="11.5">Origin traffic is amortized cluster-wide: each block is fetched from the origin roughly once, then served peer-to-peer.</text></svg>