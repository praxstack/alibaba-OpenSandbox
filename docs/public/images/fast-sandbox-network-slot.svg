<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="660" font-family="-apple-system,'Helvetica Neue',Arial,sans-serif" viewBox="0 0 1180 660"><defs><marker id="mB" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="4"><path fill="#1d4ed8" d="M0,0 L8,4 L0,8 Z"/></marker><marker id="mG" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="4"><path fill="#16a34a" d="M0,0 L8,4 L0,8 Z"/></marker><marker id="mO" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="4"><path fill="#b45309" d="M0,0 L8,4 L0,8 Z"/></marker><marker id="mP" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="4"><path fill="#9333ea" d="M0,0 L8,4 L0,8 Z"/></marker><filter id="sh" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="2" flood-color="#0f172a" flood-opacity=".14" stdDeviation="3"/></filter><linearGradient id="gHost" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#eef2f7"/></linearGradient><linearGradient id="gVM" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fef9c3"/><stop offset="1" stop-color="#fde68a"/></linearGradient><linearGradient id="gBlue" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#dbeafe"/><stop offset="1" stop-color="#bfdbfe"/></linearGradient><linearGradient id="gGreen" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#dcfce7"/><stop offset="1" stop-color="#bbf7d0"/></linearGradient><linearGradient id="gRed" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fee2e2"/><stop offset="1" stop-color="#fecaca"/></linearGradient><linearGradient id="gPurple" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#ede9fe"/><stop offset="1" stop-color="#ddd6fe"/></linearGradient></defs><rect width="1180" height="660" fill="#fff"/><text x="40" y="36" fill="#0f172a" font-size="20" font-weight="700">Fast Sandbox network slots — one pod netns, one slot per sandbox</text><text x="40" y="58" fill="#475569" font-size="12">Slots are pre-provisioned (netns · veth · masquerade) and delivered with SET_BINDING, before the sandbox runtime exists.</text><rect width="740" height="520" x="40" y="84" fill="url(#gHost)" stroke="#94a3b8" stroke-width="1.5" filter="url(#sh)" rx="14"/><text x="60" y="112" fill="#334155" font-size="14" font-weight="700">Fastlet pod network namespace</text><text x="60" y="130" fill="#64748b" font-size="11">bridge topology · net.bridge.bridge-nf-call-iptables=1 · enforcement by source IP</text><rect width="180" height="104" x="66" y="170" fill="url(#gVM)" stroke="#ca8a04" stroke-width="1.2" filter="url(#sh)" rx="10"/><text x="80" y="196" fill="#713f12" font-size="13" font-weight="700">Sandbox A</text><text x="80" y="216" fill="#78350f" font-size="11">netns · veth pair (slot)</text><text x="80" y="234" fill="#78350f" font-size="11">IP 10.30.0.5 · GW 10.30.0.1</text><text x="80" y="252" fill="#78350f" font-size="11">privateCidr 10.30.0.0/29</text><rect width="180" height="104" x="66" y="330" fill="url(#gVM)" stroke="#ca8a04" stroke-width="1.2" filter="url(#sh)" rx="10"/><text x="80" y="356" fill="#713f12" font-size="13" font-weight="700">Sandbox B</text><text x="80" y="376" fill="#78350f" font-size="11">netns · veth pair (slot)</text><text x="80" y="394" fill="#78350f" font-size="11">IP 10.30.0.6 · GW 10.30.0.2</text><rect width="250" height="196" x="300" y="150" fill="url(#gBlue)" stroke="#3b82f6" stroke-width="1.2" filter="url(#sh)" rx="10"/><text x="314" y="176" fill="#1e40af" font-size="13" font-weight="700">prerouting nat — per subject</text><text x="314" y="202" fill="#1e3a8a" font-size="10.5">ip saddr 10.30.0.5 tcp dport {80,443}</text><text x="314" y="218" fill="#1e3a8a" font-size="10.5">→ dnat to 10.30.0.1:18081 (MITM)</text><text x="314" y="242" fill="#1e3a8a" font-size="10.5">ip saddr 10.30.0.5 dport 53</text><text x="314" y="258" fill="#1e3a8a" font-size="10.5">→ redirect gw :53 → proxy :15353</text><text x="314" y="290" fill="#1e40af" font-size="10.5" font-style="italic">…one rule pair installed per slot,</text><text x="314" y="306" fill="#1e40af" font-size="10.5" font-style="italic">keyed by the slot&apos;s source IP</text><rect width="250" height="164" x="300" y="396" fill="url(#gRed)" stroke="#ef4444" stroke-width="1.2" filter="url(#sh)" rx="10"/><text x="314" y="422" fill="#991b1b" font-size="13" font-weight="700">forward chain — authoritative</text><text x="314" y="448" fill="#7f1d1d" font-size="10.5">meta mark &amp; 0x2 → allow (policy verdict)</text><text x="314" y="468" fill="#7f1d1d" font-size="10.5">unmarked → drop (deny-first default)</text><text x="314" y="488" fill="#7f1d1d" font-size="10.5">privateCidr → sibling isolation</text><text x="314" y="514" fill="#b91c1c" font-size="10.5" font-style="italic">no explicit accept: verdicts travel</text><text x="314" y="530" fill="#b91c1c" font-size="10.5" font-style="italic">as marks (bridge L2 returns accepts)</text><rect width="160" height="196" x="600" y="150" fill="url(#gGreen)" stroke="#22c55e" stroke-width="1.2" filter="url(#sh)" rx="10"/><text x="612" y="176" fill="#166534" font-size="13" font-weight="700">Shared services</text><text x="612" y="202" fill="#14532d" font-size="11">DNS proxy :15353</text><text x="612" y="220" fill="#166534" font-size="10.5">per-query policy = f(src IP)</text><text x="612" y="248" fill="#14532d" font-size="11">mitmdump :18081</text><text x="612" y="266" fill="#166534" font-size="10.5">vault lookup = f(src IP)</text><rect width="160" height="164" x="600" y="396" fill="url(#gPurple)" stroke="#8b5cf6" stroke-width="1.2" filter="url(#sh)" rx="10"/><text x="612" y="422" fill="#5b21b6" font-size="13" font-weight="700">Egress control plane</text><text x="612" y="448" fill="#4c1d95" font-size="11">Sandbox Actions handler</text><text x="612" y="468" fill="#4c1d95" font-size="11">subject registry</text><text x="612" y="488" fill="#6d28d9" font-size="10.5">absent → denying → active</text><path fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#mB)" d="M246,212 L294,212"/><text x="246" y="202" fill="#1d4ed8" font-size="10">80/443 · 53</text><path fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#mB)" d="M246,372 C272,372 276,320 294,300"/><path fill="none" stroke="#9333ea" stroke-width="2" marker-end="url(#mP)" d="M550,215 L594,215"/><text x="546" y="204" fill="#9333ea" font-size="10">src IP kept</text><path fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#mO)" d="M425,346 L425,390"/><text x="433" y="372" fill="#b45309" font-size="10">non-intercepted</text><path fill="none" stroke="#475569" stroke-width="2" marker-end="url(#mB)" d="M425,560 L425,576"/><ellipse cx="425" cy="590" fill="#f1f5f9" stroke="#94a3b8" rx="86" ry="12"/><text x="425" y="594" fill="#475569" font-size="10" text-anchor="middle">external network</text><rect width="320" height="314" x="820" y="84" fill="#fff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#sh)" rx="12"/><text x="836" y="112" fill="#0f172a" font-size="14" font-weight="700">SET_BINDING envelope</text><text x="836" y="138" fill="#334155" font-size="11">sandbox.uid → subject identity</text><text x="836" y="162" fill="#334155" font-size="11">revision.runtimeInstanceId · attachmentId</text><text x="836" y="180" fill="#334155" font-size="11">→ identity fencing (change = rebind)</text><text x="836" y="208" fill="#0f172a" font-size="12" font-weight="700">attachment.network</text><text x="836" y="232" fill="#334155" font-size="11">ip → dispatch key (ip saddr)</text><text x="836" y="256" fill="#334155" font-size="11">gateway → DNS REDIRECT / MITM DNAT</text><text x="836" y="280" fill="#334155" font-size="11">privateCidr → sibling isolation</text><text x="836" y="304" fill="#334155" font-size="11">hostVeth → reserved (bridge topology)</text><text x="836" y="336" fill="#64748b" font-size="10.5">The slot&apos;s IP is the only key the hot path needs:</text><text x="836" y="352" fill="#64748b" font-size="10.5">packet → src IP → subject → policy verdict.</text><text x="836" y="380" fill="#64748b" font-size="10.5">Guests hold no NET_ADMIN in the pod netns.</text><rect width="320" height="122" x="820" y="428" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2" filter="url(#sh)" rx="12"/><text x="836" y="456" fill="#166534" font-size="13" font-weight="700">Slot pre-provisioning</text><text x="836" y="480" fill="#14532d" font-size="11">netns · veth · MASQUERADE exist before create</text><text x="836" y="500" fill="#14532d" font-size="11">attachment ships with SET_BINDING</text><text x="836" y="524" fill="#15803d" font-size="11" font-weight="600">→ no per-create network setup window</text></svg>