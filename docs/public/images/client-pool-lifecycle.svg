<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" aria-labelledby="title desc" role="img" viewBox="0 0 1400 720"><title id="title">Client Pool Lifecycle State Machine</title><desc id="desc">State machine of the client pool. Lifecycle states NOT_STARTED, STARTING, RUNNING, DRAINING and STOPPED, with an inner health substate machine on RUNNING that toggles between HEALTHY and DEGRADED based on consecutive warmup or reconcile failures.</desc><defs><marker id="a4-arrow" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1e3a5f" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="a4-arrow-red" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#b91c1c" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="a4-arrow-green" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#047857" d="M 0 0 L 10 5 L 0 10 z"/></marker><style>text{font-family:Menlo,Monaco,Consolas,&quot;Liberation Mono&quot;,monospace}.title{font-size:26px;font-weight:700;fill:#1e40af}.subtitle{font-size:13px;fill:#475569}.state-name{font-size:15px;font-weight:700;fill:#0f172a}.state-hint{font-size:11px;fill:#475569}.edge-label{fill:#1e3a5f}.edge-label,.edge-label-green,.edge-label-red{font-size:12px;font-weight:600}.edge-label-red{fill:#b91c1c}.edge-label-green{fill:#047857}.frame-label{font-size:13px;font-weight:700;fill:#6d28d9}.caption{font-size:12px;fill:#475569;font-style:italic}</style></defs><text x="700" y="38" class="title" text-anchor="middle">Client Pool Lifecycle State Machine</text><text x="700" y="60" class="subtitle" text-anchor="middle">Outer: pool instance lifecycle. Inner: health substates while RUNNING.</text><circle cx="90" cy="240" r="9" fill="#0f172a"/><rect width="180" height="80" x="140" y="200" fill="#f1f5f9" stroke="#334155" stroke-width="2" rx="14"/><text x="230" y="235" class="state-name" text-anchor="middle">NOT_STARTED</text><text x="230" y="258" class="state-hint" text-anchor="middle">constructed, not started</text><path fill="none" stroke="#1e3a5f" stroke-width="2" marker-end="url(#a4-arrow)" d="M 99 240 L 138 240"/><rect width="180" height="80" x="380" y="200" fill="#eff6ff" stroke="#1e3a5f" stroke-width="2" rx="14"/><text x="470" y="235" class="state-name" text-anchor="middle">STARTING</text><text x="470" y="258" class="state-hint" text-anchor="middle">init warmup / reconcile</text><path fill="none" stroke="#1e3a5f" stroke-width="2" marker-end="url(#a4-arrow)" d="M 320 240 L 378 240"/><text x="349" y="228" class="edge-label" text-anchor="middle">start()</text><rect width="440" height="360" x="620" y="130" fill="#ecfdf5" stroke="#047857" stroke-width="2.5" rx="14"/><text x="640" y="156" fill="#047857" class="frame-label">RUNNING</text><text x="640" y="176" class="state-hint">acquire enabled; reconcile replenishes</text><rect width="160" height="80" x="670" y="220" fill="#fff" stroke="#047857" stroke-width="2" rx="12"/><text x="750" y="253" fill="#047857" class="state-name" text-anchor="middle">HEALTHY</text><text x="750" y="276" class="state-hint" text-anchor="middle">normal cadence</text><rect width="160" height="80" x="860" y="380" fill="#fef3c7" stroke="#92400e" stroke-width="2" rx="12"/><text x="940" y="413" fill="#92400e" class="state-name" text-anchor="middle">DEGRADED</text><text x="940" y="436" class="state-hint" text-anchor="middle">backoff only in Go</text><path fill="none" stroke="#b91c1c" stroke-width="2" marker-end="url(#a4-arrow-red)" d="M 830 300 Q 900 340 890 378"/><text x="885" y="336" class="edge-label-red">consecutive failures ≥ degraded_threshold</text><path fill="none" stroke="#047857" stroke-width="2" marker-end="url(#a4-arrow-green)" d="M 870 380 Q 800 340 795 302"/><text x="720" y="366" class="edge-label-green" text-anchor="middle">one success</text><circle cx="670" cy="182" r="6" fill="#0f172a"/><path fill="none" stroke="#1e3a5f" stroke-width="2" marker-end="url(#a4-arrow)" d="M 675 186 L 720 218"/><text x="840" y="490" class="caption" text-anchor="middle">acquire is still allowed while DEGRADED</text><path fill="none" stroke="#1e3a5f" stroke-width="2" marker-end="url(#a4-arrow)" d="M 560 240 L 618 240"/><text x="589" y="228" class="edge-label" text-anchor="middle">init complete</text><path fill="none" stroke="#b91c1c" stroke-width="2" marker-end="url(#a4-arrow-red)" d="M 470 280 Q 470 500 470 560"/><text x="490" y="450" class="edge-label-red">start failed</text><rect width="180" height="80" x="380" y="540" fill="#fef3c7" stroke="#92400e" stroke-width="2" rx="14"/><text x="470" y="575" fill="#92400e" class="state-name" text-anchor="middle">DRAINING</text><text x="470" y="598" class="state-hint" text-anchor="middle">wait for in-flight warmups</text><path fill="none" stroke="#1e3a5f" stroke-width="2" marker-end="url(#a4-arrow)" d="M 780 490 Q 780 580 562 580"/><text x="672" y="568" class="edge-label" text-anchor="middle">shutdown(graceful=true)</text><rect width="180" height="80" x="140" y="540" fill="#f1f5f9" stroke="#334155" stroke-width="2" rx="14"/><text x="230" y="575" class="state-name" text-anchor="middle">STOPPED</text><text x="230" y="598" class="state-hint" text-anchor="middle">terminal</text><path fill="none" stroke="#1e3a5f" stroke-width="2" marker-end="url(#a4-arrow)" d="M 378 580 L 322 580"/><text x="350" y="568" class="edge-label" text-anchor="middle">done or timeout</text><path fill="none" stroke="#b91c1c" stroke-dasharray="6 4" stroke-width="2" marker-end="url(#a4-arrow-red)" d="M 620 400 Q 400 400 320 540"/><text x="410" y="410" class="edge-label-red">shutdown(graceful=false)</text><circle cx="230" cy="670" r="9" fill="none" stroke="#0f172a" stroke-width="2"/><circle cx="230" cy="670" r="4" fill="#0f172a"/><path fill="none" stroke="#1e3a5f" stroke-width="2" marker-end="url(#a4-arrow)" d="M 230 620 L 230 660"/><text x="700" y="700" class="caption" text-anchor="middle">SandboxPoolManager.destroy(poolName) applies an extra DESTROYING → DESTROYED tombstone protocol to prevent other nodes from silently recreating the same pool name.</text></svg>