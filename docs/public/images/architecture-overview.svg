<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1288" aria-labelledby="title desc" role="img" viewBox="0 0 1600 1288"><title id="title">OpenSandbox architecture</title><desc id="desc">Applications use SDKs, CLI and MCP tools. Lifecycle requests go to the FastAPI server, backed by Docker or Kubernetes. Kubernetes composes container workload providers with a FastSandbox adapter for the external FastPath microVM platform. Execution traffic uses direct endpoints, the server proxy, or ingress to reach workload ports and execd; execd connects to optional Jupyter kernels. Optional outbound enforcement uses container sidecars or a shared Fastlet profile. Metadata stores snapshot and template records. API contracts are specifications, not deployed services.</desc><defs><marker id="control" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="8" refY="4"><path fill="#dc6b2e" d="M0 0L9 4L0 8Z"/></marker><marker id="data" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="8" refY="4"><path fill="#2563eb" d="M0 0L9 4L0 8Z"/></marker><marker id="outbound" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="8" refY="4"><path fill="#059669" d="M0 0L9 4L0 8Z"/></marker><style>text{font-family:&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif;fill:#182636}.section{font-size:14px;font-weight:700;letter-spacing:1.4px;fill:#597080}.label{font-size:17px;fill:#597080}.body{font-size:18px;fill:#4d6173}.heading{font-size:22px;font-weight:600}.edge{font-size:16px;font-weight:500}</style></defs><rect width="1600" height="1288" fill="#fff"/><text x="48" y="62" font-size="38" font-weight="700">OpenSandbox</text><text x="48" y="96" class="body">Architecture · lifecycle, execution and runtime boundaries</text><path fill="none" stroke="#dc6b2e" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#control)" d="M988 54h36"/><text x="1034" y="60" class="edge" style="fill:#dc6b2e">Lifecycle</text><path fill="none" stroke="#2563eb" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#data)" d="M1180 54h36"/><text x="1226" y="60" class="edge" style="fill:#2563eb">Execution</text><path fill="none" stroke="#059669" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#outbound)" d="M1370 54h36"/><text x="1416" y="60" class="edge" style="fill:#059669">Outbound</text><rect width="1504" height="136" x="48" y="128" fill="#f7faff" stroke="#d6e1e9" stroke-width="1.5" rx="12"/><text x="72" y="158" class="section">APPLICATIONS, AGENTS &amp; OPERATORS</text><rect width="380" height="64" x="72" y="180" fill="#fff" stroke="#dae5ef" stroke-width="1.5" rx="8"/><text x="88" y="206" class="heading">Sandbox SDKs</text><text x="88" y="231" class="label">Python · JS/TS · Java/Kotlin · C# · Go</text><rect width="388" height="64" x="472" y="180" fill="#fff" stroke="#dae5ef" stroke-width="1.5" rx="8"/><text x="488" y="206" class="heading">Code Interpreter SDKs</text><text x="488" y="231" class="label">Language-native code execution</text><rect width="272" height="64" x="880" y="180" fill="#fff" stroke="#dae5ef" stroke-width="1.5" rx="8"/><text x="896" y="206" class="heading">osb CLI</text><text x="896" y="231" class="label">Terminal &amp; automation</text><rect width="356" height="64" x="1172" y="180" fill="#fff" stroke="#dae5ef" stroke-width="1.5" rx="8"/><text x="1188" y="206" class="heading">MCP server</text><text x="1188" y="231" class="label">Tools for MCP clients</text><path fill="none" stroke="#dc6b2e" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#control)" d="M340 264V326"/><text x="356" y="299" class="edge" style="fill:#dc6b2e">Lifecycle API</text><path fill="none" stroke="#2563eb" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#data)" d="M1260 264V326"/><text x="1276" y="299" class="edge" style="fill:#2563eb">Execution &amp; services</text><rect width="840" height="180" x="48" y="326" fill="#fff9f3" stroke="#efd7c4" stroke-width="1.5" rx="12"/><text x="72" y="359" class="section">LIFECYCLE CONTROL PLANE</text><text x="72" y="395" class="heading">FastAPI lifecycle server</text><text x="72" y="428" class="body">API auth · tenant namespaces · orchestration</text><text x="72" y="457" class="body">Templates · snapshots · endpoint discovery</text><rect width="254" height="132" x="610" y="350" fill="#fff" stroke="#e7d5c8" stroke-width="1.5" rx="10"/><text x="630" y="383" class="heading">Metadata store</text><text x="630" y="416" class="body">SQLite / PostgreSQL</text><text x="630" y="446" class="label">Snapshot + template</text><text x="630" y="470" class="label">records</text><path fill="none" stroke="#dc6b2e" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#control)" d="M550 412H602"/><rect width="616" height="180" x="936" y="326" fill="#f5f9ff" stroke="#c9dbf1" stroke-width="1.5" rx="12"/><text x="960" y="359" class="section">ENDPOINT ACCESS · ALTERNATIVE ROUTES</text><rect width="166" height="102" x="960" y="382" fill="#fff" stroke="#c9dbf1" stroke-width="1.5" rx="9"/><text x="974" y="410" class="heading">Direct</text><text x="974" y="439" class="label">Host / Pod</text><text x="974" y="465" class="label">endpoints</text><rect width="178" height="102" x="1142" y="382" fill="#fff" stroke="#c9dbf1" stroke-width="1.5" rx="9"/><text x="1156" y="410" class="heading">Server Proxy</text><text x="1156" y="439" class="label">HTTP / WebSocket</text><text x="1156" y="465" class="label">in lifecycle server</text><rect width="192" height="102" x="1336" y="382" fill="#fff" stroke="#c9dbf1" stroke-width="1.5" rx="9"/><text x="1350" y="410" class="heading">Ingress</text><text x="1350" y="439" class="label">Kubernetes</text><text x="1350" y="465" class="label">optional gateway</text><path fill="none" stroke="#dc6b2e" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#control)" d="M466 506V566"/><text x="482" y="543" class="edge" style="fill:#dc6b2e">Create / manage</text><rect width="1072" height="256" x="48" y="566" fill="#fafbfd" stroke="#d8e1e8" stroke-width="1.5" rx="12"/><text x="72" y="600" class="section">RUNTIME BACKENDS</text><text x="758" y="600" class="label">Docker or Kubernetes</text><rect width="268" height="166" x="72" y="628" fill="#fff" stroke="#c9dbf1" stroke-width="1.5" rx="10"/><text x="92" y="661" class="heading">Docker</text><text x="92" y="692" class="body">Local / single host</text><text x="92" y="719" class="body">Containers · volumes</text><text x="92" y="746" class="body">Public image snapshots</text><rect width="732" height="182" x="364" y="616" fill="#f4f8fd" stroke="#c9dbf1" stroke-width="1.5" rx="10"/><text x="388" y="646" class="heading">Kubernetes</text><text x="558" y="646" class="label">composed services</text><rect width="318" height="112" x="388" y="663" fill="#fff" stroke="#c9dbf1" stroke-width="1.5" rx="10"/><text x="408" y="696" class="heading">Container providers</text><text x="408" y="727" class="body">BatchSandbox + Pool</text><text x="408" y="754" class="body">or external agent-sandbox</text><rect width="342" height="112" x="730" y="663" fill="#f0fdfa" stroke="#76c7b6" stroke-dasharray="6 5" stroke-width="1.5" rx="10"/><text x="750" y="696" class="heading">FastSandbox adapter</text><text x="750" y="727" class="body">templateId → FastPath (external)</text><text x="750" y="754" class="body">Template-backed microVMs</text><path fill="none" stroke="#dc6b2e" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#control)" d="M510 822V884"/><text x="526" y="858" class="edge" style="fill:#dc6b2e">Provision sandbox</text><rect width="1072" height="250" x="48" y="884" fill="#fff" stroke="#a9bfd8" stroke-width="1.5" rx="12"/><text x="72" y="915" class="section">SANDBOX ENVIRONMENT</text><text x="401" y="915" class="label">Container / Pod / microVM</text><rect width="304" height="136" x="72" y="966" fill="#f1fbf5" stroke="#afdcc0" stroke-width="1.5" rx="10"/><text x="92" y="999" class="heading">User workload</text><text x="92" y="1030" class="body">Applications · service ports</text><text x="92" y="1057" class="body">Your image &amp; entrypoint</text><rect width="370" height="136" x="400" y="966" fill="#f1f6ff" stroke="#a9c7f3" stroke-width="1.5" rx="10"/><text x="420" y="999" class="heading">execd</text><text x="420" y="1030" class="body">Commands · files · PTY</text><text x="420" y="1057" class="body">Isolation sessions · metrics</text><rect width="298" height="136" x="798" y="966" fill="#f8f4ff" stroke="#ccb6f0" stroke-width="1.5" rx="10"/><text x="818" y="999" class="heading">Jupyter (optional)</text><text x="818" y="1030" class="body">Code execution kernels</text><text x="818" y="1057" class="body">Local HTTP / WebSocket</text><path fill="none" stroke="#2563eb" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#data)" d="M770 1044H795"/><path fill="none" stroke="#2563eb" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#data)" d="M1260 506V540H1150V942H224V964"/><path fill="none" stroke="#2563eb" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#data)" d="M590 942V964"/><text x="790" y="932" class="edge" style="fill:#2563eb">Resolved endpoint</text><rect width="376" height="250" x="1176" y="884" fill="#f4fbf8" stroke="#c6e4d7" stroke-width="1.5" rx="12"/><text x="1200" y="915" class="section">OUTBOUND CONTROLS</text><rect width="328" height="116" x="1200" y="966" fill="#fff" stroke="#8bcbb0" stroke-width="1.5" rx="10"/><text x="1220" y="999" class="heading">Egress</text><text x="1220" y="1030" class="body">DNS · nftables network policy</text><text x="1220" y="1057" class="body">Credential Vault (optional)</text><text x="1200" y="1113" class="label">Sidecar / shared Fastlet profile</text><pa