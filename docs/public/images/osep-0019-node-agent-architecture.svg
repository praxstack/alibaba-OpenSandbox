<svg xmlns="http://www.w3.org/2000/svg" width="920" height="500" aria-labelledby="title desc" role="img" viewBox="0 0 920 500"><title id="title">OpenSandbox Node Agent data and acknowledgement flow</title><desc id="desc">Sandbox sb-abc runs print hello on node-1. Kubernetes metadata flows to the Sandbox Store. CRI log data flows through the container-logs source, pipeline, Sink SPI, and OSS or durable-file storage. After the Sink reports durable success, Pipeline creates AckResult and commits it through Source.Acknowledge to the Source checkpoint.</desc><defs><marker id="arrow-blue" markerHeight="8" markerUnits="strokeWidth" markerWidth="8" orient="auto" refX="7" refY="4"><path fill="#2563eb" d="M0,0 L8,4 L0,8 Z"/></marker><marker id="arrow-gray" markerHeight="8" markerUnits="strokeWidth" markerWidth="8" orient="auto" refX="7" refY="4"><path fill="#374151" d="M0,0 L8,4 L0,8 Z"/></marker><marker id="arrow-muted" markerHeight="8" markerUnits="strokeWidth" markerWidth="8" orient="auto" refX="7" refY="4"><path fill="#64748b" d="M0,0 L8,4 L0,8 Z"/></marker><style>.box{fill:#fff;stroke:#64748b;stroke-width:1.2;rx:5}.label,.subtitle,.title{font-family:Inter,Arial,sans-serif}.title{fill:#111827;font-size:13px;font-weight:600;text-anchor:middle}.label,.subtitle{font-size:10px}.subtitle{fill:#6b7280;text-anchor:middle}.label{fill:#4b5563}.data{fill:none;stroke:#2563eb;stroke-width:2.2;marker-end:url(#arrow-blue)}.metadata{fill:none;stroke:#64748b;stroke-width:1.4;stroke-dasharray:5 4;marker-end:url(#arrow-muted)}.ack{fill:none;stroke:#374151;stroke-width:1.5;marker-end:url(#arrow-gray)}</style></defs><rect width="620" height="440" x="140" y="30" fill="#fcfcfd" stroke="#cbd5e1" stroke-width="1.2" rx="8"/><text x="160" y="59" fill="#111827" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600">Node Agent on node-1 (DaemonSet)</text><path d="M115 120 H370" class="metadata"/><path d="M445 150 V215" class="metadata"/><path d="M115 250 H170" class="data"/><path d="M310 250 H375" class="data"/><path d="M515 250 H580" class="data"/><path d="M720 250 H780" class="data"/><path d="M445 285 V319 H650 V330" class="ack"/><path d="M585 362 H520" class="ack"/><path d="M370 362 H305" class="ack"/><text x="180" y="106" class="label">Pod metadata</text><text x="455" y="181" class="label">sandbox_id</text><text x="170" y="199" fill="#2563eb" font-family="Inter, Arial, sans-serif" font-size="10">sb-abc: print(&quot;hello&quot;)</text><text x="160" y="319" class="label">Commit path</text><text x="475" y="309" class="label">durable Consume succeeded → Pipeline creates AckResult</text><g><rect width="105" height="60" x="10" y="90" class="box"/><text x="62.5" y="116" class="title">Kubernetes API</text><text x="62.5" y="134" class="subtitle">list / watch</text></g><g><rect width="150" height="60" x="370" y="90" class="box"/><text x="445" y="116" class="title">Sandbox Store</text><text x="445" y="134" class="subtitle">Pod UID index</text></g><g><rect width="105" height="70" x="10" y="215" class="box"/><text x="62.5" y="246" class="title">CRI log files</text><text x="62.5" y="264" class="subtitle">/var/log/pods</text></g><g><rect width="140" height="70" x="170" y="215" class="box"/><text x="240" y="246" class="title">container-logs</text><text x="240" y="264" class="subtitle">tail · parse · cursor</text></g><g><rect width="140" height="70" x="375" y="215" class="box"/><text x="445" y="246" class="title">Pipeline</text><text x="445" y="264" class="subtitle">enrich · admit · batch</text></g><g><rect width="140" height="70" x="580" y="215" class="box"/><text x="650" y="246" class="title">Sink SPI</text><text x="650" y="264" class="subtitle">consume · finalize</text></g><g><rect width="130" height="70" x="780" y="215" class="box"/><text x="845" y="246" fill="#111827" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">OSS / durable file</text><text x="845" y="264" class="subtitle">objects + marker</text></g><g><rect width="130" height="64" x="585" y="330" class="box"/><text x="650" y="358" class="title">AckResult</text><text x="650" y="376" class="subtitle">created by Pipeline</text></g><g><rect width="150" height="64" x="370" y="330" class="box"/><text x="445" y="358" fill="#111827" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Source.Acknowledge</text><text x="445" y="376" class="subtitle">validate · commit</text></g><g><rect width="135" height="64" x="170" y="330" class="box"/><text x="237.5" y="358" class="title">Source checkpoint</text><text x="237.5" y="376" class="subtitle">committed cursor · gaps</text></g><g><rect width="560" height="32" x="160" y="420" class="box"/><text x="440" y="440" class="subtitle">Core runtime: config · plugin lifecycle · health · metrics</text></g></svg>