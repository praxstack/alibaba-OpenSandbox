<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="430" font-family="-apple-system,'Helvetica Neue',Arial,sans-serif" viewBox="0 0 1180 430"><defs><marker id="mA" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="4"><path fill="#2563eb" d="M0,0 L8,4 L0,8 Z"/></marker><marker id="mG" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="4"><path fill="#64748b" d="M0,0 L8,4 L0,8 Z"/></marker><filter id="sh" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="2" flood-color="#0f172a" flood-opacity=".12" stdDeviation="3"/></filter></defs><rect width="1180" height="430" fill="#fff"/><text x="40" y="36" fill="#0f172a" font-size="20" font-weight="700">Sandbox lifecycle states</text><text x="40" y="58" fill="#64748b" font-size="12">Creation is asynchronous; pause/resume keeps the sandbox ID; terminal states reflect what happened to the workload.</text><rect width="150" height="56" x="60" y="200" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)" rx="10"/><text x="135" y="234" fill="#0f172a" font-size="14" font-weight="700" text-anchor="middle">Pending</text><rect width="150" height="56" x="300" y="200" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)" rx="10"/><text x="375" y="234" fill="#0f172a" font-size="14" font-weight="700" text-anchor="middle">Running</text><rect width="140" height="52" x="560" y="70" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)" rx="10"/><text x="630" y="102" fill="#0f172a" font-size="13" font-weight="700" text-anchor="middle">Pausing</text><rect width="140" height="52" x="770" y="70" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)" rx="10"/><text x="840" y="102" fill="#0f172a" font-size="13" font-weight="700" text-anchor="middle">Paused</text><rect width="140" height="52" x="980" y="70" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)" rx="10"/><text x="1050" y="102" fill="#0f172a" font-size="13" font-weight="700" text-anchor="middle">Resuming</text><rect width="150" height="56" x="300" y="320" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)" rx="10"/><text x="375" y="354" fill="#0f172a" font-size="14" font-weight="700" text-anchor="middle">Stopping</text><rect width="150" height="56" x="560" y="320" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)" rx="10"/><text x="635" y="354" fill="#0f172a" font-size="14" font-weight="700" text-anchor="middle">Terminated</text><rect width="150" height="56" x="820" y="320" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)" rx="10"/><text x="895" y="354" fill="#0f172a" font-size="14" font-weight="700" text-anchor="middle">Failed</text><path fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#mA)" d="M210,228 L294,228"/><text x="216" y="216" fill="#64748b" font-size="11">ready</text><path fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#mA)" d="M375,200 L375,150 C375,118 420,96 554,96"/><text x="392" y="120" fill="#2563eb" font-size="11">pause()</text><path fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#mA)" d="M700,96 L764,96"/><path fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#mA)" d="M910,96 L974,96"/><path fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#mA)" d="M1050,122 C1050,175 620,190 456,222"/><text x="700" y="172" fill="#2563eb" font-size="11">resume()</text><path fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#mA)" d="M375,256 L375,314"/><text x="383" y="290" fill="#64748b" font-size="11">delete / TTL</text><path fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#mA)" d="M450,348 L554,348"/><path fill="none" stroke="#64748b" stroke-dasharray="6 4" stroke-width="1.8" marker-end="url(#mG)" d="M452,248 C620,290 760,308 814,330"/><text x="620" y="292" fill="#64748b" font-size="11">exit ≠ 0 / crash</text><rect width="1060" height="30" x="60" y="392" fill="#f8fafc" stroke="#e2e8f0" rx="8"/><text x="80" y="412" fill="#475569" font-size="11.5">resume() works only from Paused · TTL is absolute and never resets · exit code 0 → Terminated, non-zero → Failed</text></svg>