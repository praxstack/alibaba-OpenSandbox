<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="880" aria-labelledby="title desc" role="img" viewBox="0 0 1400 880"><title id="title">Warmup Reconcile Sequence</title><desc id="desc">Conceptual sequence diagram of the warmup reconcile loop on the leader node. Python, JavaScript, and Kotlin use a nominal one-second cadence and separate create admission from staged post-create work; Go uses a configurable interval and a single concurrency cap. The loop replenishes only while it owns the primary lock.</desc><defs><marker id="a2-arrow" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1e3a5f" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="a2-arrow-ret" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#6d28d9" d="M 0 0 L 10 5 L 0 10 z"/></marker><style>text{font-family:Menlo,Monaco,Consolas,&quot;Liberation Mono&quot;,monospace}.actor,.title{font-weight:700}.title{font-size:26px;fill:#1e40af}.actor{font-size:14px;fill:#0f172a}.msg{font-size:12px;fill:#1e3a5f}.ret{fill:#6d28d9;font-style:italic}.caption,.note,.ret{font-size:12px}.note{fill:#92400e}.caption{fill:#475569;font-style:italic}.phase{font-size:13px;font-weight:700;fill:#c2410c}.lifeline{stroke:#94a3b8;stroke-dasharray:4,4}.actor-box{fill:#eff6ff;stroke:#1e3a5f;stroke-width:1.5;rx:6}</style></defs><text x="700" y="38" class="title" text-anchor="middle">Conceptual Warmup Reconcile Sequence (Leader node)</text><g><rect width="160" height="42" x="60" y="70" class="actor-box"/><text x="140" y="97" class="actor" text-anchor="middle">Timer</text><rect width="180" height="42" x="320" y="70" class="actor-box"/><text x="410" y="97" class="actor" text-anchor="middle">Reconcile Loop</text><rect width="180" height="42" x="600" y="70" class="actor-box"/><text x="690" y="97" class="actor" text-anchor="middle">PoolStateStore</text><rect width="180" height="42" x="880" y="70" class="actor-box"/><text x="970" y="97" class="actor" text-anchor="middle">Warmup Worker</text><rect width="180" height="42" x="1160" y="70" class="actor-box"/><text x="1250" y="97" class="actor" text-anchor="middle">Lifecycle API</text></g><line x1="140" x2="140" y1="112" y2="830" class="lifeline"/><line x1="410" x2="410" y1="112" y2="830" class="lifeline"/><line x1="690" x2="690" y1="112" y2="830" class="lifeline"/><line x1="970" x2="970" y1="112" y2="830" class="lifeline"/><line x1="1250" x2="1250" y1="112" y2="830" class="lifeline"/><path fill="none" stroke="#1e3a5f" stroke-width="1.8" marker-end="url(#a2-arrow)" d="M 140 160 L 408 160"/><text x="274" y="152" class="msg" text-anchor="middle">1. tick (1s Py/JS/JVM; configured Go)</text><path fill="none" stroke="#1e3a5f" stroke-width="1.8" marker-end="url(#a2-arrow)" d="M 410 200 L 688 200"/><text x="549" y="192" class="msg" text-anchor="middle">2. acquireLock(owner_id, ttl=primary_lock_ttl)</text><rect width="720" height="70" x="380" y="220" fill="#fef3c7" stroke="#92400e" stroke-width="1" opacity=".35" rx="4"/><text x="395" y="240" class="phase">alt lock not acquired (skip this tick)</text><path fill="none" stroke="#6d28d9" stroke-dasharray="5 3" stroke-width="1.8" marker-end="url(#a2-arrow-ret)" d="M 688 260 L 412 260"/><text x="550" y="252" class="ret" text-anchor="middle">false</text><text x="410" y="282" class="note">→ Reconcile Loop returns immediately and waits for the next tick</text><rect width="960" height="470" x="380" y="310" fill="#ecfdf5" stroke="#047857" stroke-width="1" opacity=".25" rx="4"/><text x="395" y="330" class="phase">else lock acquired → leader replenishes</text><path fill="none" stroke="#1e3a5f" stroke-width="1.8" marker-end="url(#a2-arrow)" d="M 410 360 L 688 360"/><text x="549" y="352" class="msg" text-anchor="middle">3. count idle &amp; reap expired entries</text><path fill="none" stroke="#6d28d9" stroke-dasharray="5 3" stroke-width="1.8" marker-end="url(#a2-arrow-ret)" d="M 688 400 L 412 400"/><text x="550" y="392" class="ret" text-anchor="middle">idle_count = N</text><text x="410" y="430" class="note">// admit up to warmup_create_qps (Py/JS/JVM) or warmup_concurrency (Go)</text><rect width="890" height="290" x="440" y="450" fill="#faf5ff" stroke="#6d28d9" stroke-width="1" opacity=".35" rx="4"/><text x="455" y="470" fill="#6d28d9" class="phase">loop up to admission cap</text><path fill="none" stroke="#1e3a5f" stroke-width="1.8" marker-end="url(#a2-arrow)" d="M 410 500 L 968 500"/><text x="689" y="492" class="msg" text-anchor="middle">4. dispatch create task</text><path fill="none" stroke="#1e3a5f" stroke-width="1.8" marker-end="url(#a2-arrow)" d="M 970 540 L 1248 540"/><text x="1109" y="532" class="msg" text-anchor="middle">5. create(creation_spec)</text><path fill="none" stroke="#6d28d9" stroke-dasharray="5 3" stroke-width="1.8" marker-end="url(#a2-arrow-ret)" d="M 1250 580 L 972 580"/><text x="1110" y="572" class="ret" text-anchor="middle">sandbox_id</text><path fill="none" stroke="#1e3a5f" stroke-width="1.8" marker-end="url(#a2-arrow)" d="M 970 620 L 1248 620"/><text x="1109" y="612" class="msg" text-anchor="middle">6. wait ready (≤ warmup_ready_timeout)</text><text x="990" y="655" class="note">opt: warmup_health_check</text><text x="990" y="675" class="note">prepare once; opt: post-prepare check (Py/JS/JVM)</text><path fill="none" stroke="#1e3a5f" stroke-width="1.8" marker-end="url(#a2-arrow)" d="M 970 715 L 692 715"/><text x="830" y="707" class="msg" text-anchor="middle">7. push(sandbox_id, expiry = now + idle_timeout)</text><text x="60" y="800" class="caption">After degraded_threshold failures the pool enters DEGRADED; only Go applies replenish backoff.</text><text x="60" y="820" class="caption">Py/JS/JVM renew leadership independently and fence idle commits by the active run and leader epoch.</text></svg>