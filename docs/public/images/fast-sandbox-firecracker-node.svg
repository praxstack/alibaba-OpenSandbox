 y="98" fill="#5b21b6" font-size="14" font-weight="700">fast-sandbox control plane</text><text x="456" y="118" fill="#6d28d9" font-size="11">reconcilers + FastPath gRPC · SandboxTemplate builds</text><rect width="170" height="76" x="1060" y="70" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.3" filter="url(#sh)" rx="12"/><text x="1074" y="98" fill="#92400e" font-size="13" font-weight="700">Artifact store</text><text x="1074" y="118" fill="#a16207" font-size="10.5">S3-compatible · 4 MiB blocks</text><rect width="540" height="380" x="50" y="210" fill="url(#gNode)" stroke="#60a5fa" stroke-width="1.5" filter="url(#sh)" rx="14"/><text x="70" y="240" fill="#1e40af" font-size="14" font-weight="700">Cluster node A</text><text x="70" y="258" fill="#64748b" font-size="10.5">state-root: /var/lib/fast-sandbox/control-plane (node-private)</text><rect width="240" height="100" x="76" y="282" fill="url(#gBlue)" stroke="#3b82f6" stroke-width="1.2" filter="url(#sh)" rx="10"/><text x="90" y="306" fill="#1e40af" font-size="12.5" font-weight="700">runtime-agent (DaemonSet)</text><text x="90" y="326" fill="#1e3a8a" font-size="10.5">owns Firecracker VM lifecycle on this node</text><text x="90" y="344" fill="#1e3a8a" font-size="10.5">unix: /run/fast-sandbox/firecracker/</text><text x="90" y="360" fill="#1e3a8a" font-size="10.5">runtime.sock · /v1/health → dartUp</text><rect width="240" height="100" x="344" y="282" fill="url(#gGreen)" stroke="#22c55e" stroke-width="1.2" filter="url(#sh)" rx="10"/><text x="358" y="306" fill="#166534" font-size="12.5" font-weight="700">DART daemon (node-local)</text><text x="358" y="326" fill="#14532d" font-size="10.5">artifact delivery · roster peer</text><text x="358" y="344" fill="#14532d" font-size="10.5">pull order: cache → peer → origin</text><rect width="240" height="80" x="76" y="430" fill="url(#gVM)" stroke="#ca8a04" stroke-width="1.2" filter="url(#sh)" rx="10"/><text x="90" y="456" fill="#713f12" font-size="12.5" font-weight="700">Firecracker microVM</text><text x="90" y="476" fill="#78350f" font-size="10.5">golden image from template build</text><text x="90" y="494" fill="#78350f" font-size="10.5">KVM on the node</text><rect width="240" height="80" x="344" y="430" fill="url(#gVM)" stroke="#ca8a04" stroke-width="1.2" filter="url(#sh)" rx="10"/><text x="358" y="456" fill="#713f12" font-size="12.5" font-weight="700">Firecracker microVM</text><text x="358" y="476" fill="#78350f" font-size="10.5">netns + veth from fastlet slot</text><text x="358" y="494" fill="#78350f" font-size="10.5">egress policy by source IP</text><path fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#mB)" d="M196,382 L196,424"/><path fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#mB)" d="M464,382 L464,424"/><text x="204" y="410" fill="#64748b" font-size="10">starts / supervises</text><text x="472" y="410" fill="#64748b" font-size="10">netns attachment</text><rect width="540" height="380" x="670" y="210" fill="url(#gNode)" stroke="#60a5fa" stroke-width="1.5" filter="url(#sh)" rx="14"/><text x="690" y="240" fill="#1e40af" font-size="14" font-weight="700">Cluster node B</text><text x="690" y="258" fill="#64748b" font-size="10.5">state-root: /var/lib/fast-sandbox/worker (node-private)</text><rect width="240" height="100" x="696" y="282" fill="url(#gBlue)" stroke="#3b82f6" stroke-width="1.2" filter="url(#sh)" rx="10"/><text x="710" y="306" fill="#1e40af" font-size="12.5" font-weight="700">runtime-agent (DaemonSet)</text><text x="710" y="326" fill="#1e3a8a" font-size="10.5">owns Firecracker VM lifecycle on this node</text><text x="710" y="344" fill="#1e3a8a" font-size="10.5">same unix-socket API as node A</text><rect width="240" height="100" x="964" y="282" fill="url(#gGreen)" stroke="#22c55e" stroke-width="1.2" filter="url(#sh)" rx="10"/><text x="978" y="306" fill="#166534" font-size="12.5" font-weight="700">DART daemon (node-local)</text><text x="978" y="326" fill="#14532d" font-size="10.5">artifact delivery · roster peer</text><text x="978" y="344" fill="#14532d" font-size="10.5">pull order: cache → peer → origin</text><rect width="240" height="80" x="696" y="430" fill="url(#gVM)" stroke="#ca8a04" stroke-width="1.2" filter="url(#sh)" rx="10"/><text x="710" y="456" fill="#713f12" font-size="12.5" font-weight="700">Firecracker microVM</text><text x="710" y="476" fill="#78350f" font-size="10.5">golden image via DART pull</text><path fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#mB)" d="M816,382 L816,424"/><path fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#mB)" d="M500,146 C380,180 250,220 200,276"/><text x="196" y="192" fill="#1d4ed8" font-size="10.5" font-weight="600">socket delegation:</text><text x="196" y="206" fill="#1d4ed8" font-size="10.5">VM ops via agent API (unix socket)</text><path fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#mB)" d="M720,146 C780,180 800,220 816,272"/><text x="800" y="140" fill="#1d4ed8" font-size="10.5">identical delegation</text><path fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#mG)" d="M958,334 L590,334"/><text x="776" y="412" fill="#16a34a" font-size="10.5" font-weight="600" text-anchor="middle">cache miss → peer serves blocks</text><path fill="none" stroke="#16a34a" stroke-dasharray="5 4" stroke-width="1.5" d="M630,470 L630,560"/><text x="618" y="515" fill="#16a34a" font-size="10.5" text-anchor="middle" transform="rotate(-90 618 515)">P2P roster — headless Service «dart»</text><path fill="none" stroke="#b45309" stroke-width="2" marker-end="url(#mO)" d="M464,282 C600,190 880,120 1054,104"/><text x="800" y="168" fill="#b45309" font-size="10.5" font-weight="600">first create: fetch blocks from origin</text><path fill="none" stroke="#94a3b8" stroke-dasharray="5 4" stroke-width="1.5" marker-end="url(#mO)" d="M1084,282 C1110,240 1124,200 1136,152"/><text x="1132" y="220" fill="#64748b" font-size="10">only blocks</text><text x="1132" y="234" fill="#64748b" font-size="10">no peer has</text><rect width="1160" height="40" x="50" y="606" fill="#f8fafc" stroke="#e2e8f0" rx="8"/><text x="66" y="631" fill="#334155" font-size="11.5">Pull order: cache → peer → origin · origin fetched ≈ once per block cluster-wide · visibility: dart_block_source_total{source=cache|peer|origin}</text></svg>