ader)</text><line x1="250" x2="308" y1="360" y2="360" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/><path stroke="#15803d" stroke-width="1.5" marker-end="url(#arrow-green)" d="M 680 435 L 718 435"/></svg>