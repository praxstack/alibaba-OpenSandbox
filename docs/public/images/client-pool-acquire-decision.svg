<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" aria-labelledby="title desc" role="img" viewBox="0 0 1400 920"><title id="title">Acquire Decision Flow</title><desc id="desc">Decision flow of pool.acquire. Pop one idle sandbox ID from the store; if the remaining TTL is too small, discard and treat as empty; otherwise connect, run optional health check, renew to the caller-supplied timeout, and return. On empty buffer or candidate failure, FAIL_FAST raises and DIRECT_CREATE falls back to creating a new sandbox via the lifecycle API.</desc><defs><marker id="a3-arrow" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1e3a5f" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="a3-arrow-red" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#b91c1c" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="a3-arrow-green" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#047857" d="M 0 0 L 10 5 L 0 10 z"/></marker><style>text{font-family:Menlo,Monaco,Consolas,&quot;Liberation Mono&quot;,monospace}.title{font-size:26px;font-weight:700;fill:#1e40af}.step-title,.subtitle{font-size:13px}.subtitle{fill:#475569}.step-title{font-weight:700;fill:#0f172a}.step-body{font-size:11px;fill:#334155}.decision-text{font-size:13px;font-weight:700;fill:#92400e}.edge-label{font-size:11px;fill:#475569;font-weight:600}.fail-label,.success-label{font-size:13px;font-weight:700}.success-label{fill:#047857}.fail-label{fill:#b91c1c}.caption{font-size:12px;fill:#475569;font-style:italic}</style></defs><text x="700" y="36" class="title" text-anchor="middle">Acquire Decision: FAIL_FAST vs DIRECT_CREATE</text><text x="700" y="58" class="subtitle" text-anchor="middle">Execution flow of pool.acquire(sandbox_timeout, policy)</text><ellipse cx="700" cy="100" fill="#eff6ff" stroke="#1e3a5f" stroke-width="2" rx="150" ry="26"/><text x="700" y="105" class="step-title" text-anchor="middle">pool.acquire(timeout, policy)</text><polygon fill="#fef3c7" stroke="#92400e" stroke-width="2" points="700 160 900 215 700 270 500 215"/><text x="700" y="205" class="decision-text" text-anchor="middle">pop one idle ID</text><text x="700" y="225" class="decision-text" text-anchor="middle">from the store</text><text x="700" y="245" class="step-body" text-anchor="middle">buffer empty?</text><path fill="none" stroke="#1e3a5f" stroke-width="2" marker-end="url(#a3-arrow)" d="M 700 126 L 700 158"/><polygon fill="#fef3c7" stroke="#92400e" stroke-width="2" points="700 320 940 375 700 430 460 375"/><text x="700" y="365" class="decision-text" text-anchor="middle">remaining TTL ≥</text><text x="700" y="385" class="decision-text" text-anchor="middle">acquire_min_remaining_ttl?</text><path fill="none" stroke="#047857" stroke-width="2" marker-end="url(#a3-arrow-green)" d="M 700 270 L 700 318"/><text x="770" y="298" class="edge-label">got id</text><rect width="290" height="90" x="1000" y="330" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5" rx="6"/><text x="1145" y="358" class="step-title" text-anchor="middle">discard + best-effort kill</text><text x="1145" y="378" class="step-body" text-anchor="middle">avoid returning a soon-to-expire</text><text x="1145" y="396" class="step-body" text-anchor="middle">sandbox; fall through to policy</text><path fill="none" stroke="#b91c1c" stroke-width="2" marker-end="url(#a3-arrow-red)" d="M 940 375 L 998 375"/><text x="965" y="365" fill="#b91c1c" class="edge-label">no</text><rect width="340" height="130" x="530" y="470" fill="#fff" stroke="#1e3a5f" stroke-width="2" rx="6"/><text x="700" y="500" class="step-title" text-anchor="middle">Sandbox.connect(id)</text><text x="700" y="525" class="step-body" text-anchor="middle">acquire_health_check (skippable)</text><text x="700" y="545" class="step-body" text-anchor="middle">poll within acquire_ready_timeout</text><text x="700" y="575" class="step-body" font-weight="700" text-anchor="middle">renew(sandbox_timeout)</text><path fill="none" stroke="#047857" stroke-width="2" marker-end="url(#a3-arrow-green)" d="M 700 430 L 700 468"/><text x="720" y="452" fill="#047857" class="edge-label">yes</text><ellipse cx="700" cy="660" fill="#ecfdf5" stroke="#047857" stroke-width="2.5" rx="200" ry="30"/><text x="700" y="666" class="success-label" text-anchor="middle">✓ return Sandbox to caller</text><path fill="none" stroke="#047857" stroke-width="2" marker-end="url(#a3-arrow-green)" d="M 700 600 L 700 628"/><text x="475" y="530" class="fail-label" text-anchor="end">connect fails /</text><text x="475" y="548" class="fail-label" text-anchor="end">health check times out</text><path fill="none" stroke="#b91c1c" stroke-width="2" marker-end="url(#a3-arrow-red)" d="M 530 535 Q 260 535 260 375"/><polygon fill="#fef3c7" stroke="#92400e" stroke-width="2" points="200 215 400 275 200 335 60 275"/><text x="200" y="270" class="decision-text" text-anchor="middle">policy?</text><text x="200" y="290" class="step-body" text-anchor="middle">(buffer empty or candidate failed)</text><path fill="none" stroke="#b91c1c" stroke-width="2" marker-end="url(#a3-arrow-red)" d="M 500 215 L 402 250"/><text x="450" y="220" fill="#b91c1c" class="edge-label">empty</text><path fill="none" stroke="#b91c1c" stroke-dasharray="6 4" stroke-width="2" marker-end="url(#a3-arrow-red)" d="M 1145 420 Q 1145 720 300 720 Q 200 720 200 336"/><text x="700" y="740" fill="#b91c1c" class="edge-label" text-anchor="middle">back to policy decision after discard</text><rect width="320" height="120" x="40" y="400" fill="#fee2e2" stroke="#b91c1c" stroke-width="2" rx="6"/><text x="200" y="428" fill="#b91c1c" class="step-title" text-anchor="middle">FAIL_FAST</text><text x="200" y="454" class="step-body" text-anchor="middle">raise PoolEmptyException /</text><text x="200" y="472" class="step-body" text-anchor="middle">PoolAcquireFailedException</text><text x="200" y="500" class="step-body" font-style="italic" text-anchor="middle">← caller decides retry / fallback</text><path fill="none" stroke="#b91c1c" stroke-width="2" marker-end="url(#a3-arrow-red)" d="M 160 335 L 160 398"/><text x="120" y="370" fill="#b91c1c" class="edge-label" text-anchor="middle">FAIL_FAST</text><rect width="320" height="180" x="40" y="560" fill="#ecfdf5" stroke="#047857" stroke-width="2" rx="6"/><text x="200" y="588" fill="#047857" class="step-title" text-anchor="middle">DIRECT_CREATE (default)</text><text x="200" y="614" class="step-body" text-anchor="middle">create a new sandbox via</text><text x="200" y="634" class="step-body" text-anchor="middle">create(creation_spec)</text><text x="200" y="654" class="step-body" text-anchor="middle">→ wait for ready</text><text x="200" y="674" class="step-body" text-anchor="middle">→ renew(sandbox_timeout)</text><text x="200" y="702" class="step-body" font-style="italic" text-anchor="middle">← does not count toward max_idle</text><path fill="none" stroke="#047857" stroke-width="2" marker-end="url(#a3-arrow-green)" d="M 240 335 L 240 558"/><text x="280" y="450" fill="#047857" class="edge-label" text-anchor="middle">DIRECT_CREATE</text><path fill="none" stroke="#047857" stroke-width="2" marker-end="url(#a3-arrow-green)" d="M 360 660 L 500 660"/><text x="700" y="810" class="caption" text-anchor="middle">Each acquire tries one idle candidate. A failed candidate still pays up to acquire_ready_timeout.</text><text x="700" y="832" class="caption" text-anchor="middle">DIRECT_CREATE fallback does not consume max_idle; max_idle only bounds the warm buffer size.</text></svg>