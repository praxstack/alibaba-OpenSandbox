<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" aria-labelledby="title desc" role="img" viewBox="0 0 1100 620"><title id="title">Isolation Session Runtime Layout</title><desc id="desc">Inside a single sandbox, execd forks one bwrap child per isolation session. Each bwrap runs a long-lived bash isolated by Linux namespaces. Overlay upper directories live on the host, so the filesystem proxy operates outside the namespaces.</desc><defs><marker id="a-green" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#047857" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="a-purple" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#6d28d9" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="a-orange" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#c2410c" d="M 0 0 L 10 5 L 0 10 z"/></marker><style>text{font-family:Menlo,Monaco,Consolas,&quot;Liberation Mono&quot;,monospace}.box-title{font-weight:700}.panel-title,.title{font-weight:700;fill:#1e40af}.title{font-size:22px}.panel-title{font-size:16px}.box-title{font-size:15px;fill:#1e3a5f}.detail,.mono{font-weight:600}.mono{font-size:13px;fill:#374151}.detail{font-size:12px;fill:#64748b}.line{fill:none;stroke-linecap:round;stroke-linejoin:round}</style></defs><rect width="1100" height="620" fill="#fff"/><text x="30" y="40" class="title">Isolation Session Runtime Layout</text><rect width="1040" height="470" x="30" y="70" fill="#dbeafe" stroke="#1e40af" stroke-width="2.5" rx="10" ry="10"/><text x="50" y="98" class="panel-title">Sandbox (one container, one kernel)</text><rect width="980" height="80" x="60" y="120" fill="#a7f3d0" stroke="#047857" stroke-width="2" rx="8" ry="8"/><text x="80" y="145" class="box-title">execd (parent process)</text><text x="80" y="168" class="mono">POST /session · POST /session/{id}/run · DELETE /session/{id} · /files (FS proxy)</text><text x="80" y="187" class="detail">forks one bwrap per session, streams stdout back to clients as SSE</text><rect width="300" height="270" x="60" y="240" fill="#fff" stroke="#1e3a5f" stroke-width="2" rx="8" ry="8"/><text x="80" y="268" class="box-title">bwrap · Session A</text><text x="80" y="286" class="detail">ns: PID · mount · IPC · UTS</text><rect width="260" height="70" x="80" y="304" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5" rx="6" ry="6"/><text x="95" y="326" class="box-title">bash (PID 1 in ns)</text><text x="95" y="346" class="mono">stdin ← pipe ← execd</text><text x="95" y="364" class="mono">stdout → pipe → execd</text><rect width="260" height="105" x="80" y="388" fill="#ddd6fe" stroke="#6d28d9" stroke-width="1.5" rx="6" ry="6"/><text x="95" y="410" fill="#6d28d9" class="box-title">mounts inside ns</text><text x="95" y="432" class="mono">/workspace = overlay(</text><text x="95" y="450" class="mono">lower = host workspace,</text><text x="95" y="468" class="mono">upper = A/upper</text><text x="95" y="486" class="mono">)</text><rect width="300" height="270" x="390" y="240" fill="#fff" stroke="#1e3a5f" stroke-width="2" rx="8" ry="8"/><text x="410" y="268" class="box-title">bwrap · Session B</text><text x="410" y="286" class="detail">isolated from A</text><rect width="260" height="70" x="410" y="304" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5" rx="6" ry="6"/><text x="425" y="326" class="box-title">bash (PID 1 in ns)</text><text x="425" y="346" class="mono">state is per-session:</text><text x="425" y="364" class="mono">export X=1 in A ≠ seen in B</text><rect width="260" height="105" x="410" y="388" fill="#ddd6fe" stroke="#6d28d9" stroke-width="1.5" rx="6" ry="6"/><text x="425" y="410" fill="#6d28d9" class="box-title">mounts inside ns</text><text x="425" y="432" class="mono">/workspace = overlay(</text><text x="425" y="450" class="mono">lower = host workspace,</text><text x="425" y="468" class="mono">upper = B/upper</text><text x="425" y="486" class="mono">)</text><rect width="320" height="270" x="720" y="240" fill="#fef3c7" stroke="#b45309" stroke-width="2" rx="8" ry="8"/><text x="740" y="268" fill="#b45309" class="box-title">Host-side (outside ns)</text><text x="740" y="286" class="detail">same container FS as execd</text><rect width="280" height="90" x="740" y="304" fill="#fff" stroke="#b45309" stroke-width="1.5" rx="6" ry="6"/><text x="755" y="326" fill="#b45309" class="box-title">overlay upper dirs</text><text x="755" y="348" class="mono">/var/lib/execd/isolation/</text><text x="755" y="366" class="mono">├── A/upper/ ← A&apos;s writes</text><text x="755" y="384" class="mono">└── B/upper/ ← B&apos;s writes</text><rect width="280" height="86" x="740" y="408" fill="#fff" stroke="#b45309" stroke-width="1.5" rx="6" ry="6"/><text x="755" y="430" fill="#b45309" class="box-title">FS proxy path</text><text x="755" y="452" class="mono">execd reads/writes merged view</text><text x="755" y="470" class="mono">from host — no ns entry needed</text><text x="755" y="488" class="mono">(works during long-running runs)</text><rect width="340" height="50" x="380" y="555" fill="#ddd6fe" stroke="#6d28d9" stroke-width="2" rx="8" ry="8"/><text x="550" y="586" class="box-title" text-anchor="middle">SDK / curl / lifecycle server</text><path stroke="#6d28d9" stroke-width="2.5" marker-end="url(#a-purple)" d="M 550 555 V 205" class="line"/><path stroke="#047857" stroke-width="2.5" marker-end="url(#a-green)" d="M 210 205 V 240" class="line"/><path stroke="#047857" stroke-width="2.5" marker-end="url(#a-green)" d="M 540 205 V 240" class="line"/><path stroke="#c2410c" stroke-dasharray="6 6" stroke-width="2.5" marker-end="url(#a-orange)" d="M 880 205 V 240" class="line"/><g transform="translate(50, 588)"><line x1="0" x2="30" y1="-4" y2="-4" stroke="#6d28d9" stroke-width="2.5" marker-end="url(#a-purple)"/><text x="38" y="0" class="detail">HTTP</text><line x1="90" x2="120" y1="-4" y2="-4" stroke="#047857" stroke-width="2.5" marker-end="url(#a-green)"/><text x="128" y="0" class="detail">fork + pipes</text><line x1="220" x2="250" y1="-4" y2="-4" stroke="#c2410c" stroke-dasharray="6 6" stroke-width="2.5" marker-end="url(#a-orange)"/><text x="258" y="0" class="detail">FS proxy</text></g></svg>