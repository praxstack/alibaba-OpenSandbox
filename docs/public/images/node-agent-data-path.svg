<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="470" font-family="-apple-system,'Helvetica Neue',Arial,sans-serif" viewBox="0 0 1180 470"><defs><marker id="mB" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="4"><path fill="#2563eb" d="M0,0 L8,4 L0,8 Z"/></marker><marker id="mG" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="4"><path fill="#64748b" d="M0,0 L8,4 L0,8 Z"/></marker><filter id="sh" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="2" flood-color="#0f172a" flood-opacity=".12" stdDeviation="3"/></filter></defs><rect width="1180" height="470" fill="#fff"/><text x="40" y="36" fill="#0f172a" font-size="20" font-weight="700">Node Agent — from node logs to durable records</text><text x="40" y="58" fill="#64748b" font-size="12">One collector per node tails every sandbox&apos;s output and ships it to durable storage.</text><rect width="230" height="70" x="60" y="110" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)" rx="10"/><text x="76" y="138" fill="#0f172a" font-size="13" font-weight="700">Sandbox pod A</text><text x="76" y="160" fill="#94a3b8" font-size="11">stdout / stderr (kubelet logs)</text><rect width="230" height="70" x="60" y="200" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)" rx="10"/><text x="76" y="228" fill="#0f172a" font-size="13" font-weight="700">Sandbox pod B</text><text x="76" y="250" fill="#94a3b8" font-size="11">stdout / stderr (kubelet logs)</text><rect width="230" height="56" x="60" y="300" fill="#fff" stroke="#cbd5e1" stroke-dasharray="5 4" stroke-width="1.2" rx="10"/><text x="76" y="324" fill="#64748b" font-size="12" font-weight="700">Pooled (warm) pod</text><text x="76" y="344" fill="#94a3b8" font-size="10.5">not an allocation — excluded</text><rect width="330" height="280" x="400" y="100" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)" rx="14"/><text x="420" y="132" fill="#0f172a" font-size="14" font-weight="700">Node Agent</text><text x="420" y="152" fill="#94a3b8" font-size="11">DaemonSet · one per node</text><text x="420" y="192" fill="#475569" font-size="12">source: container-logs</text><text x="420" y="232" fill="#475569" font-size="12">bounded per-sandbox queues</text><text x="420" y="272" fill="#475569" font-size="12">crash-recovering checkpoint</text><text x="420" y="312" fill="#475569" font-size="12">sink: one durable target</text><text x="420" y="352" fill="#94a3b8" font-size="11">backpressure instead of silent drops</text><rect width="290" height="120" x="850" y="110" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)" rx="12"/><text x="866" y="140" fill="#0f172a" font-size="13" font-weight="700">Durable local files</text><text x="866" y="164" fill="#475569" font-size="11">&lt;cluster&gt;/&lt;namespace&gt;/&lt;sandbox_id&gt;/</text><text x="866" y="184" fill="#475569" font-size="11">&lt;pod_uid&gt;/ + finalized marker</text><text x="866" y="208" fill="#94a3b8" font-size="11">retention managed by the operator</text><rect width="290" height="110" x="850" y="270" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)" rx="12"/><text x="866" y="298" fill="#0f172a" font-size="13" font-weight="700">Alibaba Cloud OSS</text><text x="866" y="322" fill="#475569" font-size="11">same layout · append/read/write only,</text><text x="866" y="340" fill="#475569" font-size="11">never delete · cleanup is offline</text><text x="866" y="364" fill="#94a3b8" font-size="11">refuses unsafe bucket configurations</text><path fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#mB)" d="M290,145 L394,190"/><path fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#mB)" d="M290,235 L394,250"/><text x="298" y="180" fill="#2563eb" font-size="10.5">tail &amp; stream</text><path fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#mG)" d="M730,180 L844,165"/><path fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#mG)" d="M730,310 L844,330"/><text x="738" y="160" fill="#64748b" font-size="10.5">objects + marker</text><rect width="1080" height="30" x="60" y="410" fill="#f8fafc" stroke="#e2e8f0" rx="8"/><text x="80" y="430" fill="#475569" font-size="11.5">At-least-once delivery: duplicates are possible, silent loss is not — every stream ends in a completeness marker.</text></svg>