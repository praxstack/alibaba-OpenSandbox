<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="870" aria-labelledby="title desc" role="img" viewBox="0 0 1600 870"><title id="title">Node Agent — from sandbox output to durable records</title><desc id="desc">On each Kubernetes node, sandbox pods write stdout and stderr to kubelet log files. The Node Agent DaemonSet tails those files with the container-logs source, or observes syscalls with an optional eBPF source, batches records through bounded per-sandbox queues, and writes them to one durable target: Alibaba Cloud OSS or durable local files. After the sink accepts a write durably, acknowledgements flow back through the pipeline and the source cursor advances in node-local recovery state. Each stream lands as numbered generations plus an immutable finalized marker that reports complete, complete-with-drops, or incomplete. Pooled warm pods are excluded.</desc><defs><marker id="data" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="8" refY="4"><path fill="#2563eb" d="M0 0L9 4L0 8Z"/></marker><marker id="ack" markerHeight="8" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto" refX="8" refY="4"><path fill="#dc6b2e" d="M0 0L9 4L0 8Z"/></marker><style>text{font-family:&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif;fill:#182636}.section{font-size:14px;font-weight:700;letter-spacing:1.4px;fill:#597080}.label{font-size:17px;fill:#597080}.body{font-size:18px;fill:#4d6173}.heading{font-size:22px;font-weight:600}.edge{font-size:16px;font-weight:500}</style></defs><rect width="1600" height="870" fill="#fff"/><text x="48" y="62" font-size="38" font-weight="700">Node Agent — from sandbox output to durable records</text><text x="48" y="96" class="body">One collector per node: tail sandbox streams, batch them through bounded queues, land each stream beside an honest completeness marker.</text><path fill="none" stroke="#2563eb" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#data)" d="M1150 54h36"/><text x="1196" y="60" class="edge" style="fill:#2563eb">Records</text><path fill="none" stroke="#dc6b2e" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#ack)" d="M1330 54h36"/><text x="1376" y="60" class="edge" style="fill:#dc6b2e">Ack &amp; durable progress</text><rect width="404" height="560" x="48" y="128" fill="#fafbfd" stroke="#d8e1e8" stroke-width="1.5" rx="12"/><text x="72" y="162" class="section">KUBERNETES NODE</text><rect width="356" height="100" x="72" y="186" fill="#fff" stroke="#dae5ef" stroke-width="1.5" rx="8"/><text x="92" y="222" class="heading">Sandbox pod A</text><text x="92" y="254" class="body">sandbox container — stdout / stderr</text><text x="92" y="282" class="label">kubelet files under /var/log/pods</text><rect width="356" height="100" x="72" y="310" fill="#fff" stroke="#dae5ef" stroke-width="1.5" rx="8"/><text x="92" y="346" class="heading">Sandbox pod B</text><text x="92" y="378" class="body">sandbox container — stdout / stderr</text><text x="92" y="406" class="label">kubelet files under /var/log/pods</text><rect width="356" height="88" x="72" y="470" fill="#fff" stroke="#c9d4de" stroke-dasharray="6 5" stroke-width="1.5" rx="8"/><text x="92" y="506" class="heading">Pooled (warm) pod</text><text x="92" y="536" class="label">no sandbox identity — excluded</text><text x="72" y="660" class="label">selection by identity: sandbox ID + sandbox container</text><rect width="560" height="560" x="500" y="128" fill="#f7faff" stroke="#d6e1e9" stroke-width="1.5" rx="12"/><text x="524" y="162" class="section">NODE AGENT</text><text x="700" y="162" class="label">DaemonSet · one per Linux node</text><rect width="480" height="104" x="540" y="186" fill="#f1f6ff" stroke="#a9c7f3" stroke-width="1.5" rx="10"/><text x="560" y="222" class="heading">Sources</text><text x="560" y="252" class="body">container-logs tails kubelet files · syscalls (opt-in)</text><text x="560" y="280" class="label">eBPF attached per sandbox cgroup</text><rect width="480" height="104" x="540" y="314" fill="#fff" stroke="#dae5ef" stroke-width="1.5" rx="10"/><text x="560" y="350" class="heading">Pipeline</text><text x="560" y="380" class="body">bounded per-sandbox queues · strict stream order</text><text x="560" y="408" class="label">block backpressure, or accounted drops</text><rect width="480" height="104" x="540" y="442" fill="#fff" stroke="#dae5ef" stroke-width="1.5" rx="10"/><text x="560" y="478" class="heading">Sink</text><text x="560" y="508" class="body">one durable target — batched record writes</text><text x="560" y="536" class="label">append + finalize, verified by size and checksum</text><rect width="480" height="94" x="540" y="570" fill="#fff9f3" stroke="#efd7c4" stroke-width="1.5" rx="10"/><text x="560" y="604" class="heading">Recovery state (node-local)</text><text x="560" y="636" class="label">checkpoints · finalize intents · bound to the target identity</text><path fill="none" stroke="#2563eb" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#data)" d="M720 292V310"/><text x="736" y="308" class="edge" style="fill:#2563eb">records</text><path fill="none" stroke="#dc6b2e" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#ack)" d="M840 312V294"/><text x="872" y="308" class="edge" style="fill:#dc6b2e">acks</text><path fill="none" stroke="#2563eb" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#data)" d="M720 420V438"/><path fill="none" stroke="#dc6b2e" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#ack)" d="M840 440V422"/><path fill="none" stroke="#dc6b2e" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#ack)" d="M780 548V566"/><text x="796" y="562" class="edge" style="fill:#dc6b2e">durable write</text><rect width="444" height="560" x="1108" y="128" fill="#f4fbf8" stroke="#c6e4d7" stroke-width="1.5" rx="12"/><text x="1132" y="162" class="section">DURABLE TARGETS</text><rect width="396" height="140" x="1132" y="186" fill="#fff" stroke="#8bcbb0" stroke-width="1.5" rx="8"/><text x="1152" y="222" class="heading">Alibaba Cloud OSS</text><text x="1152" y="252" class="body">appendable generations + immutable markers</text><text x="1152" y="280" class="label">credentials: append · read · write — never delete</text><text x="1152" y="304" class="label">deletion is a separate offline tool</text><rect width="396" height="116" x="1132" y="350" fill="#fff" stroke="#8bcbb0" stroke-width="1.5" rx="8"/><text x="1152" y="386" class="heading">Durable local files</text><text x="1152" y="416" class="body">same object-family layout, node-local</text><text x="1152" y="444" class="label">rotated under size, count, and volume caps</text><rect width="396" height="174" x="1132" y="490" fill="#fff" stroke="#c6e4d7" stroke-width="1.5" rx="8"/><text x="1152" y="524" class="heading">One family per stream</text><text x="1152" y="558" class="label">&lt;cluster&gt;/&lt;namespace&gt;/&lt;sandbox_id&gt;/</text><text x="1152" y="586" class="label">&lt;pod_uid&gt;/sandbox.&lt;generation&gt;.log</text><text x="1152" y="614" class="label">sandbox.finalized.&lt;revision&gt;.json</text><text x="1152" y="646" class="body">consumers verify by size and checksum</text><path fill="none" stroke="#2563eb" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#data)" d="M428 236L536 240"/><text x="440" y="228" class="edge" style="fill:#2563eb">tail &amp; stream</text><path fill="none" stroke="#2563eb" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#data)" d="M428 360L536 264"/><path fill="none" stroke="#2563eb" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#data)" d="M1020 476H1088V256H1124"/><path fill="none" stroke="#2563eb" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.3" marker-end="url(#data)" d="M1020 512H1104V408H1128"/><rect width="150" height="24" x="1028" y="450" fill="#fff"/><text x="1036" y="468" class="edge" style="fill:#2563eb">objects + marker</text><rect width="1504" height="96" x="48" y="728" fill="#f7f9fc" stroke="#d6e1e9" stroke-width="1.5" rx="10"/><text x="72" y="764" class="heading">Completeness markers</text><text x="340" y="764" class="body">complete · complete-with-drops · incomplete — markers state what is provable, never optimistic</text><text x="72" y="798" class="label">at-least-once within the coverage window: duplicates are possible, unaccounted loss is not</text></svg>