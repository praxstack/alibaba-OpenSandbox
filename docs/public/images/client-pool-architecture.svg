<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" aria-labelledby="title desc" role="img" viewBox="0 0 1400 720"><title id="title">Client Pool Architecture</title><desc id="desc">Client pool architecture. Multiple application nodes call pool.acquire on a per-node SandboxPool instance. The pool consists of an any-node acquire path and a leader-only reconcile loop that drives staged warmup work. The shared PoolStateStore holds idle sandbox IDs and expiry plus leader, sizing, TTL, and namespace-destroy coordination. All server-side sandboxes are created via the OpenSandbox Lifecycle API.</desc><defs><marker id="a1-arrow-blue" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#1e3a5f" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="a1-arrow-purple" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#6d28d9" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="a1-arrow-orange" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#c2410c" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="a1-arrow-green" markerHeight="9" markerUnits="userSpaceOnUse" markerWidth="9" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#047857" d="M 0 0 L 10 5 L 0 10 z"/></marker><style>text{font-family:Menlo,Monaco,Consolas,&quot;Liberation Mono&quot;,monospace}.title{font-size:26px;fill:#1e40af}.box-title,.group-title,.title{font-weight:700}.group-title{font-size:15px}.box-title{font-size:14px;fill:#0f172a}.box-text{font-size:12px;fill:#334155}.caption,.edge-label{fill:#475569}.edge-label{font-size:11px}.caption{font-size:12px;font-style:italic}</style></defs><text x="700" y="38" class="title" text-anchor="middle">Client Pool Architecture</text><g><rect width="280" height="360" x="40" y="80" fill="#eff6ff" stroke="#1e3a5f" stroke-width="2" rx="8"/><text x="180" y="108" fill="#1e3a5f" class="group-title" text-anchor="middle">Application nodes (N)</text><rect width="220" height="120" x="70" y="140" fill="#fff" stroke="#1e3a5f" stroke-width="1.5" rx="6"/><text x="180" y="168" class="box-title" text-anchor="middle">App code #1</text><text x="180" y="192" class="box-text" text-anchor="middle">pool.acquire(...)</text><text x="180" y="212" class="box-text" text-anchor="middle">sandbox.commands.run(...)</text><text x="180" y="232" class="box-text" text-anchor="middle">sandbox.destroy()</text><rect width="220" height="120" x="70" y="290" fill="#fff" stroke="#1e3a5f" stroke-width="1.5" rx="6"/><text x="180" y="318" class="box-title" text-anchor="middle">App code #2</text><text x="180" y="342" class="box-text" text-anchor="middle">pool.acquire(...)</text><text x="180" y="362" class="box-text" text-anchor="middle">...</text></g><g><rect width="380" height="500" x="400" y="80" fill="#faf5ff" stroke="#6d28d9" stroke-width="2" rx="8"/><text x="590" y="108" fill="#6d28d9" class="group-title" text-anchor="middle">SandboxPool instance (per node)</text><rect width="320" height="120" x="430" y="140" fill="#fff" stroke="#6d28d9" stroke-width="1.5" rx="6"/><text x="590" y="168" class="box-title" text-anchor="middle">Acquire path</text><text x="590" y="188" class="box-text" text-anchor="middle">(runs on every node)</text><text x="590" y="216" class="box-text" text-anchor="middle">pop idle ID → connect → renew</text><text x="590" y="236" class="box-text" text-anchor="middle">fail | create | retry | retry + create</text><rect width="320" height="120" x="430" y="290" fill="#fff" stroke="#6d28d9" stroke-width="1.5" rx="6"/><text x="590" y="318" class="box-title" text-anchor="middle">Reconcile loop</text><text x="590" y="338" class="box-text" text-anchor="middle">(leader-only replenish / shrink)</text><text x="590" y="366" class="box-text" text-anchor="middle">nominal 1s (Py/JS/JVM); configurable Go</text><text x="590" y="386" class="box-text" text-anchor="middle">acquire lock → compute gap → dispatch</text><rect width="320" height="120" x="430" y="440" fill="#fff" stroke="#6d28d9" stroke-width="1.5" rx="6"/><text x="590" y="468" class="box-title" text-anchor="middle">Warmup workers</text><text x="590" y="488" class="box-text" text-anchor="middle">Py / JS / JVM: staged concurrency</text><text x="590" y="516" class="box-text" text-anchor="middle">create → ready → prepare → validate</text><text x="590" y="536" class="box-text" text-anchor="middle">→ push id into idle buffer</text></g><g><rect width="300" height="360" x="860" y="80" fill="#fff7ed" stroke="#c2410c" stroke-width="2" rx="8"/><text x="1010" y="108" fill="#c2410c" class="group-title" text-anchor="middle">PoolStateStore (shared)</text><rect width="240" height="180" x="890" y="140" fill="#fff" stroke="#c2410c" stroke-width="1.5" rx="6"/><text x="1010" y="168" class="box-title" text-anchor="middle">Idle buffer</text><text x="1010" y="196" class="box-text" text-anchor="middle">[sandbox_id, expiry]</text><text x="1010" y="216" class="box-text" text-anchor="middle">[sandbox_id, expiry]</text><text x="1010" y="236" class="box-text" text-anchor="middle">[sandbox_id, expiry]</text><text x="1010" y="266" class="box-text" font-style="italic" text-anchor="middle">idle membership: IDs + expiry</text><text x="1010" y="286" class="box-text" font-style="italic" text-anchor="middle">no HTTP connections</text><text x="1010" y="306" class="box-text" font-style="italic" text-anchor="middle">no SDK client objects</text><rect width="240" height="80" x="890" y="345" fill="#fff" stroke="#c2410c" stroke-width="1.5" rx="6"/><text x="1010" y="373" class="box-title" text-anchor="middle">Shared coordination</text><text x="1010" y="395" class="box-text" text-anchor="middle">primary lock / max idle / TTL</text><text x="1010" y="415" class="box-text" text-anchor="middle">destroy fence + tombstone</text></g><g><rect width="300" height="100" x="860" y="480" fill="#ecfdf5" stroke="#047857" stroke-width="2" rx="8"/><text x="1010" y="510" fill="#047857" class="group-title" text-anchor="middle">OpenSandbox Lifecycle API</text><text x="1010" y="536" class="box-text" text-anchor="middle">create / connect / renew / destroy</text><text x="1010" y="556" class="box-text" text-anchor="middle">(server-side sandbox lifecycle)</text></g><path fill="none" stroke="#1e3a5f" stroke-width="2" marker-end="url(#a1-arrow-blue)" d="M 290 200 L 428 200"/><path fill="none" stroke="#1e3a5f" stroke-width="2" marker-end="url(#a1-arrow-blue)" d="M 290 350 L 428 220"/><path fill="none" stroke="#6d28d9" stroke-width="2" marker-end="url(#a1-arrow-purple)" d="M 752 200 L 888 220"/><text x="820" y="200" class="edge-label" text-anchor="middle">pop id</text><path fill="none" stroke="#6d28d9" stroke-width="2" marker-end="url(#a1-arrow-purple)" d="M 752 360 L 888 385"/><text x="820" y="365" class="edge-label" text-anchor="middle">acquire lock</text><path fill="none" stroke="#6d28d9" stroke-width="2" marker-end="url(#a1-arrow-purple)" d="M 590 410 L 590 438"/><text x="640" y="428" class="edge-label" text-anchor="start">dispatch when gap &gt; 0</text><path fill="none" stroke="#047857" stroke-width="2" marker-end="url(#a1-arrow-green)" d="M 752 500 L 888 510"/><text x="820" y="500" class="edge-label" text-anchor="middle">create()</text><path fill="none" stroke="#c2410c" stroke-dasharray="6 4" stroke-width="2" marker-end="url(#a1-arrow-orange)" d="M 700 440 Q 800 380 890 240"/><text x="810" y="380" class="edge-label" text-anchor="middle">push id</text><path fill="none" stroke="#047857" stroke-dasharray="6 4" stroke-width="2" marker-end="url(#a1-arrow-green)" d="M 752 235 Q 820 400 888 510"/><text x="770" y="455" class="edge-label" text-anchor="middle">connect / renew</text><text x="700" y="620" class="caption" text-anchor="middle">Acquire runs on every node; reconcile only runs on the node that holds the primary lock.</text><text x="700" y="642" class="caption" text-anchor="middle">Redis shares idle membership and coordination across processes / pods; SDK objects and HTTP connections stay local.</text></svg>