<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="470" font-family="-apple-system,'Helvetica Neue',Arial,sans-serif" viewBox="0 0 1180 470"><defs><marker id="mA" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="4"><path fill="#2563eb" d="M0,0 L8,4 L0,8 Z"/></marker><marker id="mR" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="4"><path fill="#64748b" d="M0,0 L8,4 L0,8 Z"/></marker><filter id="sh" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="2" flood-color="#0f172a" flood-opacity=".12" stdDeviation="3"/></filter></defs><rect width="1180" height="470" fill="#fff"/><text x="40" y="36" fill="#0f172a" font-size="20" font-weight="700">Controller resource model</text><text x="40" y="58" fill="#64748b" font-size="12">Keep warm capacity, allocate sandboxes from it, checkpoint them when idle.</text><rect width="300" height="120" x="60" y="130" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)" rx="12"/><text x="80" y="162" fill="#0f172a" font-size="15" font-weight="700">Pool</text><text x="80" y="188" fill="#475569" font-size="11.5">warm, unallocated pods, held ready</text><text x="80" y="208" fill="#94a3b8" font-size="11">bufferMin/Max · poolMin/Max · eviction</text><rect width="300" height="120" x="440" y="130" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)" rx="12"/><text x="460" y="162" fill="#0f172a" font-size="15" font-weight="700">BatchSandbox</text><text x="460" y="188" fill="#475569" font-size="11.5">one or many sandboxes (replicas)</text><text x="460" y="208" fill="#94a3b8" font-size="11">direct from template, or allocated via Pool</text><rect width="300" height="120" x="820" y="130" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)" rx="12"/><text x="840" y="162" fill="#0f172a" font-size="15" font-weight="700">SandboxSnapshot</text><text x="840" y="188" fill="#475569" font-size="11.5">pause/resume checkpoint</text><text x="840" y="208" fill="#94a3b8" font-size="11">committed rootfs image (digest-pinned)</text><path fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#mA)" d="M360,180 L434,180"/><text x="366" y="168" fill="#2563eb" font-size="11">allocation</text><path fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#mR)" d="M740,170 L814,170"/><text x="746" y="158" fill="#64748b" font-size="11">pause</text><path fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#mA)" d="M900,250 C870,290 780,270 748,254"/><text x="782" y="284" fill="#2563eb" font-size="11">resume · same sandbox ID</text><rect width="440" height="72" x="60" y="300" fill="#fff" stroke="#cbd5e1" stroke-dasharray="5 4" stroke-width="1.2" rx="10"/><text x="80" y="328" fill="#334155" font-size="12" font-weight="600">Inside an allocated pod</text><text x="80" y="350" fill="#64748b" font-size="11">a task executor runs the request&apos;s entrypoint —</text><text x="80" y="366" fill="#64748b" font-size="11">the warm pod spec is never rewritten</text><rect width="580" height="72" x="540" y="300" fill="#fff" stroke="#cbd5e1" stroke-dasharray="5 4" stroke-width="1.2" rx="10"/><text x="560" y="328" fill="#334155" font-size="12" font-weight="600">Status contract</text><text x="560" y="350" fill="#64748b" font-size="11">phase + conditions describe sandbox health; separate task counters describe task progress;</text><text x="560" y="366" fill="#64748b" font-size="11">trust status only when observedGeneration matches generation</text><rect width="1060" height="42" x="60" y="404" fill="#f8fafc" stroke="#e2e8f0" rx="8"/><text x="80" y="430" fill="#475569" font-size="11.5">Succeed means a sandbox pod is running and ready — it is the steady state, not task completion.</text></svg>